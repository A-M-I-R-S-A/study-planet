<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303a">
<title>Focus — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{--accent:oklch(0.7 0.12 62);--accent-ink:#16303a;--cream:#faf6ee;--cream2:#efe9de;--ink:#2b2824;--muted:#8a8175;--white:#fbfdfd;--danger:#c0392b}
  *{box-sizing:border-box}
  /* Kill the grey/blue rectangle Android's WebView flashes over anything tapped, and the
     focus ring left behind after a tap. :focus-visible keeps the ring for keyboard users. */
  html{-webkit-tap-highlight-color:transparent}
  :focus:not(:focus-visible){outline:none}
  html,body{height:100%}
  body{margin:0;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:#16303a;min-height:100vh;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;
    padding:calc(24px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
  /* See index.html: floor for WebViews that report no status-bar inset, and no floor at all
     in fullscreen, where there is no bar to clear. */
  html.native:not(.fs) body{padding-top:calc(24px + max(env(safe-area-inset-top),26px))}
  html.native.fs body{padding-top:calc(24px + env(safe-area-inset-top))}
  .mono{font-family:'DM Mono',ui-monospace,monospace}
  html[lang="fa"] body{font-family:'Lalezar','Vazirmatn','Segoe UI',Tahoma,sans-serif}
  .langsw{display:block;margin:10px auto 0;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;cursor:pointer;padding:4px 8px;border-radius:8px}
  .langsw:hover{color:var(--ink);background:var(--cream2)}
  .card{width:100%;max-width:400px;background:var(--cream);border-radius:24px;padding:34px 30px 28px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .brand b{font-size:19px;letter-spacing:-.01em}
  .tag{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .seg{display:flex;gap:6px;background:var(--cream2);padding:5px;border-radius:13px;margin-bottom:22px}
  .seg button{flex:1;border:none;border-radius:9px;padding:10px 0;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:transparent;color:var(--muted)}
  .seg button.active{background:var(--cream);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  label{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 6px;font-weight:500}
  .field{margin-bottom:16px}
  input{width:100%;border:1px solid rgba(0,0,0,.14);background:#fff;border-radius:12px;padding:13px 14px;font-size:15px;color:var(--ink);outline:none;transition:.15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 22%,transparent)}
  .row-hidden{display:none}
  .submit{width:100%;height:50px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
  .submit:hover{filter:brightness(1.06)}
  .submit:disabled{opacity:.6;cursor:default}
  .msg{min-height:18px;text-align:center;font-size:13px;margin-top:14px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:#2e7d46}
  .foot{text-align:center;margin-top:18px}
  .foot a{color:var(--muted);font-size:12.5px;text-decoration:none}
  .foot a:hover{color:var(--ink)}

  /* ---- appearance: Glass ----
     Same contract as the rest of the app: theme.js puts .glass on <html> from prefs.glass, and
     without it nothing above changes. .card is the only surface here, so redefining the tokens
     on it repaints the form; the rest is the literals no token reaches.

     This page runs signed out, so the choice comes from localStorage rather than the account --
     a returning user keeps the appearance they picked, and a fresh device starts on Classic. */
  html.glass .card{
    --cream:rgba(18,24,30,.68);
    --cream2:rgba(255,255,255,.07);
    --ink:#f1f5f8;
    --muted:rgba(233,240,246,.58);
    --danger:#ff7a6a;
    background:var(--cream);
    border:1px solid rgba(255,255,255,.14);
    color:var(--ink);
    backdrop-filter:blur(26px) saturate(1.5);
    -webkit-backdrop-filter:blur(26px) saturate(1.5);
    box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);
  }
  html.glass .card ::placeholder{color:rgba(233,240,246,.4)}
  html.glass .seg button.active{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
  html.glass input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--ink)}
  html.glass .langsw:hover{background:rgba(255,255,255,.1)}
  html.glass .msg.ok{color:#7fd8a2}

  /* No blur available: lean on opacity so the text keeps its contrast. */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    html.glass .card{--cream:rgba(18,24,30,.95)}
  }
</style>
</head>
<body>
  <script src="/theme.js"></script>
  <script src="/i18n.js"></script>
  <form class="card" id="form" autocomplete="on">
    <div class="brand"><span class="dot"></span><b>Focus</b></div>
    <div class="tag" data-i18n="login_tag">Your sessions, streaks &amp; settings — saved to your account.</div>

    <div class="seg">
      <button type="button" id="tabLogin" class="active" data-i18n="sign_in">Sign in</button>
      <button type="button" id="tabSignup" data-i18n="create_account">Create account</button>
    </div>

    <div class="field row-hidden" id="nameField">
      <label for="name" data-i18n="name">Name</label>
      <input id="name" name="name" type="text" data-i18n-ph="name_ph" placeholder="What should we call you?" maxlength="60">
    </div>
    <div class="field">
      <label for="email" data-i18n="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password" data-i18n="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" minlength="6">
    </div>

    <button class="submit" id="submit" type="submit" data-i18n="sign_in">Sign in</button>
    <div class="msg" id="msg"></div>
    <div class="foot">
      <a href="/" data-i18n="back_timer">← Back to the timer</a>
      <button type="button" class="langsw" id="langBtn">🌐 English</button>
    </div>
  </form>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const I=window.FocusI18n;
  let mode="login";
  const msg=$("#msg");

  document.title=I.t("login_title");
  $("#langBtn").textContent="🌐 "+I.t("lang_switch");
  $("#langBtn").onclick=()=>I.toggle();

  function setMode(m){
    mode=m;
    $("#tabLogin").classList.toggle("active",m==="login");
    $("#tabSignup").classList.toggle("active",m==="signup");
    $("#nameField").classList.toggle("row-hidden",m!=="signup");
    $("#submit").textContent = I.t(m==="login" ? "sign_in" : "create_account");
    $("#password").setAttribute("autocomplete", m==="login" ? "current-password" : "new-password");
    msg.textContent=""; msg.className="msg";
  }
  $("#tabLogin").onclick=()=>setMode("login");
  $("#tabSignup").onclick=()=>setMode("signup");

  // Already signed in? go to dashboard.
  fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json()).then(j=>{if(j&&j.user)location.href="/dashboard";}).catch(()=>{});

  // On signup, carry any guest data (same-origin localStorage) into the new account.
  function guestData(){
    const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}};
    return {
      settings:{cfg:get("ff_cfg",null),prefs:get("ff_prefs",null),bg:get("ff_bg",null),volume:get("ff_volume",null)},
      tasks:get("ff_tasks",[])
    };
  }

  $("#form").addEventListener("submit",async e=>{
    e.preventDefault();
    const email=$("#email").value.trim();
    const password=$("#password").value;
    const name=$("#name").value.trim();
    msg.textContent=""; msg.className="msg";
    $("#submit").disabled=true;
    try{
      const url = mode==="login" ? "/api/login" : "/api/signup";
      const r = await fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email,password,name})});
      const j = await r.json();
      if(!r.ok){ msg.textContent=j.error?I.serverError(j.error):I.t("generic_error"); msg.className="msg err"; $("#submit").disabled=false; return; }
      if(mode==="signup"){
        // seed the fresh account with whatever the guest had locally
        const g=guestData();
        try{
          if(g.settings.cfg||g.settings.prefs||g.settings.bg) await fetch("/api/settings",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({settings:g.settings})});
          if(g.tasks&&g.tasks.length) await fetch("/api/tasks",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({tasks:g.tasks})});
        }catch(_){}
      }
      msg.textContent=I.t("signing_in"); msg.className="msg ok";
      location.href="/dashboard";
    }catch(err){
      msg.textContent=I.t("no_server"); msg.className="msg err"; $("#submit").disabled=false;
    }
  });
})();
</script>
</body>
</html>
