<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:oklch(0.7 0.12 62);
    --accent-ink:#16303a;
    --cream:#faf6ee;
    --cream2:#efe9de;
    --ink:#2b2824;
    --muted:#8a8175;
    --white:#fbfdfd;
  }
  *{box-sizing:border-box}
  /* Kill the grey/blue rectangle Android's WebView flashes over anything tapped, and the
     focus ring left behind after a tap. :focus-visible keeps the ring for keyboard users. */
  html{-webkit-tap-highlight-color:transparent}
  :focus:not(:focus-visible){outline:none}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:#16303a;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .mono{font-family:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  /* Farsi: Persian webfont + reset spacing that breaks cursive joining */
  html[lang="fa"] body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif}
  html[lang="fa"] .mono{font-family:'Vazirmatn',ui-monospace,monospace}
  html[lang="fa"] .phase,html[lang="fa"] .qby,html[lang="fa"] .sec-label,html[lang="fa"] .wordmark{letter-spacing:normal;text-transform:none}
  html[lang="fa"] .quote .qt{font-style:normal}
  input,button{font-family:inherit}
  input:focus{outline:none}
  ::placeholder{color:#a89e8f}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* background layers */
  #bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#887326EB,#382C1F,#1F2838),#16303a;background-size:cover;background-position:center}
  #scrim{position:fixed;inset:0;z-index:-1;background:#000;opacity:0;transition:opacity .3s}

  .app{min-height:100vh;padding:calc(clamp(20px,4vw,44px) + env(safe-area-inset-top)) max(clamp(20px,4vw,44px),env(safe-area-inset-right)) clamp(20px,4vw,44px) max(clamp(20px,4vw,44px),env(safe-area-inset-left));display:flex;flex-direction:column}

  /* header */
  header{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--accent)}
  .dot.run{animation:breathe 2.4s ease-in-out infinite}
  .wordmark{font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--white)}
  .streak{font-size:13px;color:rgba(255,255,255,.72);padding-inline-start:10px;border-inline-start:1px solid rgba(255,255,255,.28);margin-inline-start:2px}
  .head-right{display:flex;align-items:center;gap:12px}
  .clock-box{text-align:end;line-height:1.1;color:var(--white)}
  .clock{font-size:26px;letter-spacing:-.01em}
  .date{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:2px}
  /* header overflow menu: keeps the top bar to two controls (account + menu) */
  .menu-wrap{position:relative;flex:none}
  .menu{position:absolute;inset-inline-end:0;top:calc(100% + 9px);z-index:60;min-width:196px;padding:6px;display:flex;flex-direction:column;gap:2px;
    border-radius:17px;border:1px solid rgba(255,255,255,.22);background:rgba(20,28,34,.88);box-shadow:0 20px 46px rgba(0,0,0,.45);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise .16s ease-out}
  .menu-item{display:flex;align-items:center;gap:11px;width:100%;height:44px;padding:0 12px;flex:none;
    border:none;border-radius:11px;background:transparent;color:var(--white);font-family:inherit;font-size:14.5px;font-weight:600;
    text-align:start;text-decoration:none;cursor:pointer}
  .menu-item:hover,.menu-item:focus-visible{background:rgba(255,255,255,.15)}
  .menu-item .mi{width:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
  .menu-item .mi svg{width:18px;height:18px}
  .acct{height:44px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--white);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;flex:none;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:170px}
  .acct:hover{background:rgba(255,255,255,.24)}
  .acct .av{font-size:17px;line-height:1}
  .acct span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gear{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--white);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .gear svg{width:21px;height:21px}
  .gear:hover,.gear.open{background:rgba(255,255,255,.26)}

  /* hero */
  /* The dock is fixed to the bottom and grows when a panel opens, so the space main
     reserves for it is measured at runtime into --dock-space (see syncDockSpace).
     The literal here is only the pre-measurement fallback. */
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vh,30px);padding:10px 0 var(--dock-space,168px);text-align:center}
  .modes{display:flex;gap:8px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:5px;border-radius:13px}
  .mode-btn{border:none;border-radius:9px;padding:9px 17px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:rgba(255,255,255,.78)}
  .mode-btn.active{background:var(--white);color:#0d4455;box-shadow:0 1px 4px rgba(0,0,0,.2)}

  .time-wrap{display:flex;flex-direction:column;align-items:center}
  .time{font-weight:500;font-size:min(clamp(76px,16vw,200px),22vh);line-height:.84;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--white);text-shadow:0 6px 34px rgba(0,0,0,.22)}
  .phase{margin-top:18px;font-size:14px;color:rgba(255,255,255,.82);letter-spacing:.16em;text-transform:uppercase}

  .prog{width:min(440px,80vw);height:5px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
  .prog>div{height:100%;background:var(--white);border-radius:99px;width:0;transition:width .3s linear}

  .controls{display:flex;gap:12px;align-items:center;justify-content:center}
  .play{min-width:140px;height:56px;border-radius:99px;border:none;cursor:pointer;font-size:16px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.22)}
  .reset{width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  .topic{width:min(360px,80vw);text-align:center;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:var(--white);border-radius:99px;padding:10px 16px;font-size:14px;outline:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .topic::placeholder{color:rgba(255,255,255,.6)}
  .topic:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
  .tabs2{display:inline-flex;gap:4px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px;border-radius:11px}
  .tabs2 button{border:none;background:transparent;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;padding:7px 15px;border-radius:8px;cursor:pointer;transition:.15s}
  .tabs2 button.on{background:var(--white);color:#0d4455}
  .subjectbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(520px,90vw);min-height:20px}
  .subj{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--white);border-radius:99px;padding:8px 14px;font-size:13.5px;cursor:pointer;transition:.15s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .subj:hover{background:rgba(255,255,255,.18)}
  .subj.on{border-color:var(--sc);background:color-mix(in oklch,var(--sc) 32%,transparent)}
  .subj .dot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
  .subj .sm{font-family:'DM Mono',ui-monospace,monospace;font-size:12px;opacity:.85}
  .subj-hint{color:rgba(255,255,255,.72);font-size:13px;text-decoration:none;border:1px dashed rgba(255,255,255,.3);padding:9px 16px;border-radius:99px}
  .subj-hint:hover{color:var(--white)}
  main.is-running .modes,
  main.is-running .reset,
  main.is-running #typeSwitch,
  main.is-running #subjectBar{display:none!important}
  main.stopwatch .modes,
  main.stopwatch .prog{display:none!important}
  .quote{margin-top:10px;max-width:min(480px,86vw);cursor:pointer;text-align:center}
  .quote .qt{font-size:17px;line-height:1.55;font-style:italic;color:rgba(255,255,255,.9)}
  .quote .qby{margin-top:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5)}

  /* dock */
  .dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px calc(22px + env(safe-area-inset-bottom));z-index:40;pointer-events:none}
  .panel{pointer-events:auto;width:min(440px,92vw);animation:rise .22s ease}
  .panel.light{background:var(--cream);border:1px solid rgba(0,0,0,.06);border-radius:22px;box-shadow:0 18px 52px rgba(0,0,0,.32)}
  .hidden{display:none!important}

  /* tasks panel */
  .tasks-panel{padding:20px 20px 14px;display:flex;flex-direction:column;max-height:56vh}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-head b{font-weight:600;font-size:15px}
  .panel-head .meta{font-size:12px;color:var(--muted)}
  .task-form{display:flex;gap:8px;margin-bottom:14px}
  .task-form input{flex:1;border:1px solid rgba(0,0,0,.12);background:var(--cream2);border-radius:11px;padding:11px 13px;font-size:14px;color:var(--ink)}
  .task-form button{width:44px;border:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:700;cursor:pointer;flex:none}
  .tk{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:48px}
  .tk::-webkit-scrollbar{width:6px}
  .tk::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:99px}
  .show-done{flex:none;margin-top:10px;align-self:center;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:9px}
  .show-done:hover{color:var(--ink);background:var(--cream2)}
  .task{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;background:var(--cream2)}
  .task .check{width:20px;height:20px;flex:none;border-radius:6px;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--cream);border:1px solid rgba(0,0,0,.18);color:transparent}
  .task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .task .txt{flex:1;font-size:14px;color:var(--ink);text-align:start;word-break:break-word}
  .task.done .txt{color:#a89e8f;text-decoration:line-through}
  .task .rm{border:none;background:none;color:#a89e8f;font-size:17px;cursor:pointer;padding:0 2px;line-height:1}
  .task .rm:hover{color:#c0392b}
  .empty-tasks{text-align:center;color:#a89e8f;font-size:13px;padding:20px 0}

  /* music panel */
  .music-panel{background:#2b2824;color:var(--cream);border-radius:22px;padding:18px 20px;box-shadow:0 18px 52px rgba(0,0,0,.34)}
  .music-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .music-head b{font-size:14px;font-weight:600}
  .music-head .now{font-size:12px;opacity:.6}
  .sound-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}
  .sound{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px 6px;cursor:pointer;text-align:center;transition:.15s;color:rgba(255,255,255,.85)}
  .sound:hover{background:rgba(255,255,255,.1)}
  .sound.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .sound svg{width:22px;height:22px;display:block;margin:0 auto}
  .sound .nm{font-size:11.5px;margin-top:7px}
  .vol{display:flex;align-items:center;gap:11px}
  .vol svg{width:16px;height:16px;color:rgba(255,255,255,.6)}
  .vol input{flex:1;accent-color:var(--accent)}

  /* stats panel */
  .stats-panel{padding:20px;display:flex;gap:12px}
  .stat{flex:1;background:var(--cream2);border-radius:15px;padding:16px 12px;text-align:center}
  .stat .v{font-size:30px;line-height:1;color:var(--accent)}
  .stat .l{margin-top:8px;font-size:12px;color:var(--muted)}

  /* co-focus (room) panel */
  .room-panel{padding:18px 18px 14px;display:flex;flex-direction:column;max-height:56vh}
  .cofocus{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:44px}
  .cofocus::-webkit-scrollbar{width:6px}
  .cofocus::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:99px}
  .co{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;background:var(--cream2)}
  .co.me{background:linear-gradient(90deg,color-mix(in oklch,var(--accent) 17%,var(--cream2)),var(--cream2));box-shadow:inset 0 0 0 1.5px color-mix(in oklch,var(--accent) 45%,transparent)}
  .co-rank{width:18px;text-align:center;font-size:12px;color:var(--muted);flex:none}
  .co-av{width:36px;height:36px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .co-av .co-live{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#3a9d5d;border:2.5px solid var(--cream2);animation:copulse 1.8s infinite}
  .co.me .co-av .co-live{border-color:#f3ecdd}
  .co-main{flex:1;min-width:0}
  .co-nm{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .co-bar{height:5px;border-radius:99px;background:rgba(0,0,0,.06);overflow:hidden;margin-top:6px}
  .co-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#e08a3c);width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .co-fill.on{background:linear-gradient(90deg,#3a9d5d,#5ec488)}
  .co-side{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
  .co-time{font-family:'DM Mono',ui-monospace,monospace;font-size:15px;color:var(--accent);flex:none;font-variant-numeric:tabular-nums;line-height:1.15}
  .co-st{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .co-st.on{color:#3a9d5d;font-weight:600}
  .co.off .co-av{filter:grayscale(.25);opacity:.9}
  .co.off .co-time{color:var(--muted)}
  @keyframes copulse{0%{box-shadow:0 0 0 0 rgba(58,157,93,.5)}70%{box-shadow:0 0 0 6px rgba(58,157,93,0)}100%{box-shadow:0 0 0 0 rgba(58,157,93,0)}}
  .acct.locked,#roomsBtn.locked{opacity:.4;pointer-events:none;filter:grayscale(.35)}

  /* dock buttons */
  .dock-btns{pointer-events:auto;display:flex;gap:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.26);padding:7px;border-radius:99px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
  .dbtn{display:flex;align-items:center;gap:7px;border:none;border-radius:99px;padding:10px 17px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:rgba(255,255,255,.85)}
  .dbtn.active{background:var(--white);color:#0d4455}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

  /* settings modal */
  .overlay{position:fixed;inset:0;background:rgba(13,68,85,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60}
  .sheet{width:100%;max-width:400px;background:var(--cream);border-radius:22px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.32);max-height:88vh;overflow-y:auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .sheet-head b{font-weight:600;font-size:17px;letter-spacing:-.01em}
  .sheet-head .x{border:none;background:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .sec-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
  .sec{margin-bottom:24px}
  .cfg-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--cream2);border-radius:13px;margin-bottom:10px}
  .cfg-row .lbl{font-size:14.5px;font-weight:500}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:var(--cream);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
  .stepper .val{font-size:16px;min-width:26px;text-align:center}
  .seg{display:flex;gap:8px;background:var(--cream2);padding:5px;border-radius:13px}
  .seg button{flex:1;border:none;border-radius:9px;padding:9px 0;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--muted)}
  .seg button.active{background:var(--cream);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .swatch{aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
  .swatch.active{border-color:var(--accent)}
  .swatch.active::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .upload{margin-top:10px}
  .upload label{display:block;text-align:center;padding:11px;border:1px dashed rgba(0,0,0,.2);border-radius:12px;color:var(--muted);font-size:13px;cursor:pointer;transition:.2s}
  .upload label:hover{color:var(--ink);border-color:var(--accent)}
  .upload input{display:none}
  .dim-row{margin-top:14px}
  .dim-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
  .dim-row .top .r{color:var(--muted)}
  .dim-row input{width:100%;accent-color:var(--accent)}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--cream2);border-radius:13px}
  .toggle-row .lbl{font-size:14.5px;font-weight:500}
  .switch{position:relative;width:44px;height:25px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .tr{position:absolute;inset:0;background:rgba(0,0,0,.18);border-radius:25px;cursor:pointer;transition:.25s}
  .switch .tr:before{content:"";position:absolute;height:19px;width:19px;inset-inline-start:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + .tr{background:var(--accent)}
  .switch input:checked + .tr:before{transform:translateX(19px)}
  html[dir="rtl"] .switch input:checked + .tr:before{transform:translateX(-19px)}

  .done-btn{width:100%;height:48px;border-radius:14px;border:none;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;cursor:pointer}
  .reset-all{display:block;width:100%;margin-top:12px;background:none;border:none;color:#c0392b;font-size:12.5px;cursor:pointer}

<script>
(async function(){

      const prev={}; if(roomInfo){roomInfo.members.forEach(m=>{prev[m.id]=m.sec;});}

        let sec=m.todaySeconds||0;
        if(m.me) sec=Math.max(sec,myLive);
        else if(prev[m.id]!=null) sec=Math.max(sec,prev[m.id]); // never let a live time jump backward
        return {id:m.id,name:m.name,avatar:m.avatar,focusing:m.me?running:!!m.focusing,sec:sec,me:!!m.me};
      })};
      renderDock(); renderRoom();   // the Room button lights up; the panel stays shut until you open it
    });
  }

  /* ---- settings ---- */
  function renderCfg(){["focusMin","shortMin","longMin"].forEach(k=>$("#v-"+k).textContent=L(cfg[k]));}
  document.querySelectorAll("[data-dur]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.dur,d=+b.dataset.d,[mn,mx]=BOUNDS[k];
    const cur=Number.isFinite(Number(cfg[k]))?Number(cfg[k]):CFG_DEF[k];   // never step off a NaN
    cfg[k]=Math.min(mx,Math.max(mn,cur+d));store.set("ff_cfg",cfg);renderCfg();
    if(!running && {focus:"focusMin",short:"shortMin",long:"longMin"}[mode]===k){secondsLeft=cfg[k]*60;renderTimer();}
  });
  function renderFmt(){$("#fmt12").classList.toggle("active",!prefs.clock24);$("#fmt24").classList.toggle("active",prefs.clock24);}
  $("#fmt12").onclick=()=>{prefs.clock24=false;store.set("ff_prefs",prefs);renderFmt();renderClock();};
  $("#fmt24").onclick=()=>{prefs.clock24=true;store.set("ff_prefs",prefs);renderFmt();renderClock();};
  $("#chime").onclick=e=>{prefs.chime=e.target.checked;store.set("ff_prefs",prefs);};

  function openSettings(){$("#overlay").classList.remove("hidden");}
  function closeSettings(){$("#overlay").classList.add("hidden");}
  $("#openSettings").onclick=openSettings;

  /* ---- header overflow menu (room / language / settings) ---- */
  const menuBtn=$("#menuBtn"), headMenu=$("#headMenu");
  function setMenu(open){
    headMenu.classList.toggle("hidden",!open);
    menuBtn.classList.toggle("open",open);
    menuBtn.setAttribute("aria-expanded",open?"true":"false");
  }
  menuBtn.onclick=e=>{e.stopPropagation();setMenu(headMenu.classList.contains("hidden"));};
  headMenu.addEventListener("click",e=>{if(e.target.closest(".menu-item"))setMenu(false);});
  document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))setMenu(false);});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")setMenu(false);});
  $("#closeSettings").onclick=closeSettings;
  $("#doneBtn").onclick=closeSettings;
  $("#overlay").onclick=e=>{if(e.target===$("#overlay"))closeSettings();};
  $("#resetAll").onclick=()=>{if(confirm(T.confirm_reset)){["ff_cfg","ff_prefs","ff_bg","ff_tasks","ff_stats","ff_streak","ff_volume"].forEach(k=>localStorage.removeItem(k));location.reload();}};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSettings();});

  /* ---- account chip ---- */
  function initAccount(){
    const a=$("#acct"), rb=$("#roomsBtn");
    if(rb)rb.classList.toggle("hidden",!Cloud.enabled);
    if(Cloud.enabled){a.href="/dashboard";a.innerHTML='<span class="av"></span><span></span>';a.querySelector(".av").textContent=Cloud.user.avatar||"🦊";a.querySelector("span:last-child").textContent=Cloud.user.name||T.dashboard;a.classList.remove("hidden");}
    else if(Cloud.served){a.href="/login";a.textContent=T.sign_in;a.classList.remove("hidden");}
    else{a.classList.add("hidden");}
  }

  /* ---- language ---- */
  function applyLang(){
    T=I18N[lang];
    document.documentElement.lang=lang;
    document.documentElement.dir=(lang==="fa")?"rtl":"ltr";
    document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T[el.dataset.i18n];});
    $("#taskInput").placeholder=T.add_task;
    renderSubjects();
    $("#uploadLabel").textContent=T.upload;
    $("#langLabel").textContent=T.lang_switch;
    renderClock();renderTimer();renderQuote();renderTasks();renderStats();renderCfg();renderMusicNow();
    $("#dimVal").textContent=L(bg.dim)+"%";
    initAccount();
  }
  $("#langBtn").onclick=()=>{lang=(lang==="en")?"fa":"en";prefs.lang=lang;store.set("ff_prefs",prefs);applyLang();};

  /* ---- init ---- */
  $("#chime").checked=prefs.chime;
  $("#dim").value=bg.dim;
  applyAccent();applyBg();buildSwatches();renderFmt();renderDock();
  applyLang();
  if(_cfgRepaired) store.set("ff_cfg",cfg);   // push the repaired durations back so the stored/cloud copy stops being broken
  if(Cloud.enabled && pendingSec>=60) flushFocus(false);   // recover time from a previous unfinished session
  if(Cloud.enabled) refreshRoom();                          // load co-focusers if already in a room
})();
</script>
</body>
</html>
