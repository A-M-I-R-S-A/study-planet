<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFlow</title>
<style>
  :root{
    --text:#edece7;
    --muted:#9a988f;
    --accent:#d9a24e;      /* warm amber */
    --accent-ink:#20160a;
    --panel:rgba(18,18,20,0.55);
    --panel-solid:rgba(24,24,27,0.92);
    --line:rgba(255,255,255,0.09);
    --line-strong:rgba(255,255,255,0.16);
    --danger:#e06a5a;
    --good:#7bbf7b;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",-apple-system,"Segoe UI",Roboto,serif;
    color:var(--text);
    background:linear-gradient(160deg,#1c1813,#0c0a07);
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* scrim sits above the background image, below the content */
  #scrim{position:fixed;inset:0;background:#000;opacity:.35;z-index:-1;transition:opacity .3s}
  .sans{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

  .shell{max-width:560px;margin:0 auto;padding:22px 20px 70px;min-height:100vh;display:flex;flex-direction:column}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
  .wordmark{font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600}
  .topright{display:flex;align-items:center;gap:18px}
  .clock{font-size:15px;letter-spacing:.05em;color:var(--text);font-variant-numeric:tabular-nums;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  .clock .dt{color:var(--muted);font-size:12px;margin-left:2px}
  .icon-btn{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;cursor:pointer;display:grid;place-items:center;transition:.2s}
  .icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
  .icon-btn svg{width:17px;height:17px}

  /* ---- TIMER: the centerpiece ---- */
  .stage{margin:auto 0;display:flex;flex-direction:column;align-items:center;padding:30px 0}
  .modes{display:inline-flex;gap:4px;margin-bottom:34px}
  .mode-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:8px 15px;border-radius:20px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-family:-apple-system,"Segoe UI",sans-serif;font-weight:600;transition:.2s}
  .mode-btn:hover{color:var(--text)}
  .mode-btn.active{background:rgba(255,255,255,.09);color:var(--text)}

  .dial{position:relative;width:320px;height:320px;max-width:82vw}
  .dial svg{transform:rotate(-90deg);width:100%;height:100%;display:block}
  .dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dial .time{font-size:82px;font-weight:300;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  .dial .mode-label{margin-top:12px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-family:-apple-system,"Segoe UI",sans-serif}

  .controls{display:flex;gap:12px;margin-top:38px}
  .btn{border:none;cursor:pointer;font-family:-apple-system,"Segoe UI",sans-serif;font-weight:600;transition:.18s;letter-spacing:.06em}
  .btn-start{background:var(--accent);color:var(--accent-ink);padding:14px 46px;border-radius:30px;font-size:14px;text-transform:uppercase}
  .btn-start:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .btn-reset{background:transparent;color:var(--muted);border:1px solid var(--line);padding:14px 26px;border-radius:30px;font-size:14px;text-transform:uppercase}
  .btn-reset:hover{color:var(--text);border-color:var(--line-strong)}
  .tally{margin-top:26px;font-size:12.5px;color:var(--muted);letter-spacing:.05em;font-family:-apple-system,"Segoe UI",sans-serif}
  .tally b{color:var(--text)}

  /* ---- collapsible panels ---- */
  .panels{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);overflow:hidden}
  .panel-head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 17px;background:none;border:none;color:var(--text);cursor:pointer;font-family:-apple-system,"Segoe UI",sans-serif}
  .panel-head .hicon{color:var(--accent);display:grid;place-items:center}
  .panel-head .hicon svg{width:18px;height:18px;display:block}
  .panel-head .htitle{flex:1;text-align:left;font-size:13.5px;letter-spacing:.06em;font-weight:600}
  .panel-head .chev{color:var(--muted);transition:transform .3s}
  .panel.open .panel-head .chev{transform:rotate(180deg)}
  .panel-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .panel.open .panel-body{grid-template-rows:1fr}
  .panel-body>.inner{overflow:hidden}
  .pad{padding:2px 17px 18px}

  /* quote */
  .quote blockquote{font-size:18px;line-height:1.5;font-style:italic}
  .quote .who{margin-top:12px;font-size:13px;color:var(--accent);font-family:-apple-system,"Segoe UI",sans-serif;font-weight:600;letter-spacing:.03em}
  .quote .again{margin-top:16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:-apple-system,"Segoe UI",sans-serif;letter-spacing:.05em}
  .quote .again:hover{color:var(--text)}

  /* tasks */
  .task-add{display:flex;gap:8px;margin-bottom:12px}
  .task-add input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:10px;font-size:14px;outline:none;font-family:-apple-system,"Segoe UI",sans-serif}
  .task-add input:focus{border-color:var(--accent)}
  .task-add button{width:42px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);border-radius:10px;cursor:pointer;font-size:20px}
  .task-add button:hover{background:rgba(255,255,255,.14)}
  ul.tasks{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:240px;overflow-y:auto}
  .tasks li{display:flex;align-items:center;gap:11px;background:rgba(0,0,0,.22);padding:11px 12px;border-radius:10px;border:1px solid transparent;transition:.15s;font-family:-apple-system,"Segoe UI",sans-serif}
  .tasks li:hover{border-color:var(--line)}
  .tasks .check{width:19px;height:19px;border-radius:6px;border:2px solid var(--muted);cursor:pointer;flex-shrink:0;display:grid;place-items:center}
  .tasks .check svg{width:11px;height:11px;color:var(--accent-ink);opacity:0}
  .tasks li.done .check{background:var(--good);border-color:var(--good)}
  .tasks li.done .check svg{opacity:1}
  .tasks li.done .tname{text-decoration:line-through;color:var(--muted)}
  .tname{flex:1;font-size:14px;word-break:break-word}
  .tasks .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;opacity:.5;padding:0 2px}
  .tasks .del:hover{color:var(--danger);opacity:1}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0;font-family:-apple-system,"Segoe UI",sans-serif}

  /* music */
  .tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .track{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:11px;padding:13px 6px;cursor:pointer;text-align:center;transition:.18s;user-select:none;font-family:-apple-system,"Segoe UI",sans-serif}
  .track:hover{background:rgba(255,255,255,.07)}
  .track.active{border-color:var(--accent);background:rgba(217,162,78,.14)}
  .track .ic{color:var(--text);display:grid;place-items:center}
  .track.active .ic{color:var(--accent)}
  .track .ic svg{width:22px;height:22px}
  .track .tt{font-size:11.5px;margin-top:7px;color:var(--muted);letter-spacing:.04em}
  .track.active .tt{color:var(--text)}
  .vol{display:flex;align-items:center;gap:11px}
  .vol svg{width:16px;height:16px;color:var(--muted)}
  .vol input{flex:1;accent-color:var(--accent)}

  /* ---- settings drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.3s;z-index:40}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:380px;max-width:90vw;background:var(--panel-solid);border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);z-index:50;padding:26px;overflow-y:auto;font-family:-apple-system,"Segoe UI",sans-serif}
  .drawer.open{transform:translateX(0)}
  .drawer h2{font-size:19px;font-weight:600;letter-spacing:.02em}
  .drawer .sub{color:var(--muted);font-size:12.5px;margin:5px 0 26px}
  .close-x{position:absolute;top:22px;right:22px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .close-x:hover{color:var(--text)}
  .group{margin-bottom:30px}
  .group .gt{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:14px}

  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .swatch{aspect-ratio:1;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
  .swatch.active{border-color:var(--accent)}
  .swatch.active::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .upload{margin-top:11px}
  .upload label{display:block;text-align:center;padding:11px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;transition:.2s}
  .upload label:hover{color:var(--text);border-color:var(--accent)}
  .upload input{display:none}
  .slider-row{margin-top:16px}
  .slider-row .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
  .slider-row .sl-top span:last-child{color:var(--muted)}
  .slider-row input{width:100%;accent-color:var(--accent)}

  .dur-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .dur-row label{font-size:14px}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:17px}
  .stepper button:hover{background:rgba(255,255,255,.1)}
  .stepper .val{width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .toggle-row .lbl{font-size:14px}
  .switch{position:relative;width:44px;height:25px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .track-sw{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:25px;cursor:pointer;transition:.25s}
  .track-sw:before{content:"";position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s}
  .switch input:checked + .track-sw{background:var(--accent)}
  .switch input:checked + .track-sw:before{transform:translateX(19px)}
  .reset-all{color:var(--danger);font-size:12.5px;background:none;border:none;cursor:pointer;letter-spacing:.03em}

  @media(max-width:480px){ .dial .time{font-size:64px} }
</style>
</head>
<body>
<div id="scrim"></div>

<div class="shell">
  <div class="topbar">
    <div class="wordmark">Focus&middot;Flow</div>
    <div class="topright">
      <div class="clock"><span id="clockTime">--:--</span><span class="dt" id="clockDate"></span></div>
      <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- TIMER — centerpiece -->
  <div class="stage">
    <div class="modes">
      <button class="mode-btn active" data-mode="focus">Focus</button>
      <button class="mode-btn" data-mode="short">Short Break</button>
      <button class="mode-btn" data-mode="long">Long Break</button>
    </div>
    <div class="dial">
      <svg viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/>
        <circle id="progress" cx="150" cy="150" r="140" fill="none" stroke="var(--accent)" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="879.6" stroke-dashoffset="0"/>
      </svg>
      <div class="center">
        <div class="time" id="time">25:00</div>
        <div class="mode-label" id="modeLabel">Focus</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-start" id="startBtn">Start</button>
      <button class="btn btn-reset" id="resetBtn">Reset</button>
    </div>
    <div class="tally">Sessions completed today &middot; <b id="doneCount">0</b></div>
  </div>

  <!-- collapsible options -->
  <div class="panels">
    <section class="panel" data-panel="quote">
      <button class="panel-head">
        <span class="hicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 21c3-1 6-4 6-9V5H4v6h4"/><path d="M14 21c3-1 6-4 6-9V5h-5v6h4"/></svg></span>
        <span class="htitle">Motivation</span>
        <span class="chev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="panel-body"><div class="inner"><div class="pad quote">
        <blockquote id="quoteText">&hellip;</blockquote>
        <div class="who" id="quoteAuthor"></div>
        <button class="again" id="newQuote">New quote &rarr;</button>
      </div></div></div>
    </section>

    <section class="panel" data-panel="task">
      <button class="panel-head">
        <span class="hicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        <span class="htitle">Tasks</span>
        <span class="chev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="panel-body"><div class="inner"><div class="pad">
        <div class="task-add">
          <input type="text" id="taskInput" placeholder="Add a study task&hellip;" maxlength="120">
          <button id="addTask" aria-label="Add task">+</button>
        </div>
        <ul class="tasks" id="taskList"></ul>
      </div></div></div>
    </section>

    <section class="panel" data-panel="music">
      <button class="panel-head">
        <span class="hicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span class="htitle">Focus Sounds</span>
        <span class="chev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="panel-body"><div class="inner"><div class="pad">
        <div class="tracks" id="tracks">
          <div class="track" data-sound="rain"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.2"/><path d="M8 19v2M12 19v3M16 19v2"/></svg></div><div class="tt">Rain</div></div>
          <div class="track" data-sound="ocean"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 17c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></svg></div><div class="tt">Ocean</div></div>
          <div class="track" data-sound="wind"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12h15a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 16h8a2 2 0 1 1-2 2"/></svg></div><div class="tt">Wind</div></div>
          <div class="track" data-sound="forest"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22V15"/><path d="M12 15l-4-4h8l-4-4-4 4"/><path d="M8 11L5 8h14l-3 3"/></svg></div><div class="tt">Forest</div></div>
        </div>
        <div class="vol">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H2v6h4l5 4z"/></svg>
          <input type="range" id="volume" min="0" max="100" value="45">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        </div>
      </div></div></div>
    </section>
  </div>
</div>

<!-- SETTINGS -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <button class="close-x" id="closeSettings">&times;</button>
  <h2>Settings</h2>
  <p class="sub">Make this space yours.</p>

  <div class="group">
    <div class="gt">Background</div>
    <div class="swatches" id="swatches"></div>
    <div class="upload">
      <label for="bgUpload">↑ Upload your own image</label>
      <input type="file" id="bgUpload" accept="image/*">
    </div>
    <div class="slider-row">
      <div class="sl-top"><span>Dim</span><span id="dimVal">35%</span></div>
      <input type="range" id="dim" min="0" max="85" value="35">
    </div>
  </div>

  <div class="group">
    <div class="gt">Timer length (minutes)</div>
    <div class="dur-row"><label>Focus</label>
      <div class="stepper"><button data-dur="focus" data-d="-1">−</button><span class="val" id="dur-focus">25</span><button data-dur="focus" data-d="1">+</button></div></div>
    <div class="dur-row"><label>Short break</label>
      <div class="stepper"><button data-dur="short" data-d="-1">−</button><span class="val" id="dur-short">5</span><button data-dur="short" data-d="1">+</button></div></div>
    <div class="dur-row"><label>Long break</label>
      <div class="stepper"><button data-dur="long" data-d="-1">−</button><span class="val" id="dur-long">15</span><button data-dur="long" data-d="1">+</button></div></div>
  </div>

  <div class="group">
    <div class="gt">Preferences</div>
    <div class="toggle-row"><span class="lbl">Chime when timer ends</span>
      <label class="switch"><input type="checkbox" id="alertToggle" checked><span class="track-sw"></span></label></div>
    <div class="toggle-row"><span class="lbl">24-hour clock</span>
      <label class="switch"><input type="checkbox" id="clock24"><span class="track-sw"></span></label></div>
  </div>

  <button class="reset-all" id="resetAll">Reset everything</button>
</div>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const store={
    get(k,d){try{const v=localStorage.getItem("ff_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
    set(k,v){try{localStorage.setItem("ff_"+k,JSON.stringify(v));}catch(e){}}
  };

  /* ---------- background presets ---------- */
  const BGS={
    ink:   "linear-gradient(160deg,#1c1813,#0c0a07)",
    slate: "linear-gradient(160deg,#222730,#0e1116)",
    forest:"linear-gradient(160deg,#152c22,#081410)",
    ocean: "linear-gradient(160deg,#122636,#070f18)",
    plum:  "linear-gradient(160deg,#251a2a,#120b16)",
    ember: "linear-gradient(160deg,#2b1a13,#140a08)",
    rose:  "linear-gradient(160deg,#2a1820,#140a0f)",
    night: "radial-gradient(1000px 700px at 30% 15%,#2b303b 0%,#0b0e13 62%)"
  };

  /* ---------- state ---------- */
  let settings=store.get("settings",{dur:{focus:25,short:5,long:15},alert:true,clock24:false});
  let bg=store.get("bg",{type:"preset",value:"ink",dim:35});
  let openPanels=store.get("openPanels",{});
  let tasks=store.get("tasks",[]);
  let doneCount=store.get("doneCount",{date:todayKey(),n:0});
  if(doneCount.date!==todayKey()){doneCount={date:todayKey(),n:0};store.set("doneCount",doneCount);}
  function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

  /* ---------- background ---------- */
  function applyBg(){
    if(bg.type==="image"){ document.body.style.backgroundImage="url("+bg.value+")"; }
    else { document.body.style.backgroundImage=BGS[bg.value]||BGS.ink; }
    $("#scrim").style.opacity=(bg.dim/100).toString();
  }
  function buildSwatches(){
    const wrap=$("#swatches"); wrap.innerHTML="";
    Object.keys(BGS).forEach(id=>{
      const b=document.createElement("button");
      b.className="swatch"+(bg.type==="preset"&&bg.value===id?" active":"");
      b.style.background=BGS[id];
      b.title=id;
      b.addEventListener("click",()=>{ bg={type:"preset",value:id,dim:bg.dim}; store.set("bg",bg); applyBg(); buildSwatches(); });
      wrap.appendChild(b);
    });
  }
  $("#bgUpload").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      bg={type:"image",value:rd.result,dim:bg.dim};
      try{ store.set("bg",bg); }catch(err){ alert("That image is a bit large to save — it'll show now but may not persist."); }
      applyBg(); buildSwatches();
    };
    rd.readAsDataURL(f);
  });
  $("#dim").addEventListener("input",e=>{ bg.dim=+e.target.value; $("#dimVal").textContent=bg.dim+"%"; store.set("bg",bg); applyBg(); });

  /* ---------- clock ---------- */
  function tickClock(){
    const d=new Date();
    let h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0"),ap="";
    if(!settings.clock24){ ap=h>=12?" PM":" AM"; h=h%12||12; }
    $("#clockTime").textContent=String(h).padStart(2,"0")+":"+m+ap;
    $("#clockDate").textContent=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  }
  setInterval(tickClock,1000); tickClock();

  /* ---------- timer ---------- */
  const CIRC=879.6;
  let mode="focus",total=settings.dur.focus*60,remaining=total,running=false,ticker=null;
  const labels={focus:"Focus",short:"Short Break",long:"Long Break"};
  function fmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
  function render(){
    $("#time").textContent=fmt(remaining);
    const frac=total>0?remaining/total:0;
    $("#progress").style.strokeDashoffset=(CIRC*(1-frac)).toString();
    $("#modeLabel").textContent=labels[mode];
    $("#doneCount").textContent=doneCount.n;
    document.title=(running?fmt(remaining)+" · ":"")+"FocusFlow";
  }
  function setMode(m){
    mode=m;total=settings.dur[m]*60;remaining=total;stop();
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
    render();
  }
  function start(){
    if(running){stop();return;}
    running=true;$("#startBtn").textContent="Pause";
    ticker=setInterval(()=>{remaining--;if(remaining<=0){remaining=0;render();done();return;}render();},1000);
  }
  function stop(){running=false;clearInterval(ticker);$("#startBtn").textContent="Start";render();}
  function reset(){remaining=total;stop();}
  function done(){
    stop();
    if(mode==="focus"){doneCount.n++;store.set("doneCount",doneCount);}
    if(settings.alert)beep();
    notify(mode==="focus"?"Focus session complete — take a break.":"Break's over — back to it.");
    remaining=total;render();
  }
  $("#startBtn").addEventListener("click",start);
  $("#resetBtn").addEventListener("click",reset);
  document.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

  function beep(){
    try{
      const c=new (window.AudioContext||window.webkitAudioContext)();
      [0,.18,.36].forEach(t=>{
        const o=c.createOscillator(),g=c.createGain();
        o.type="sine";o.frequency.value=760;o.connect(g);g.connect(c.destination);
        g.gain.setValueAtTime(.0001,c.currentTime+t);
        g.gain.exponentialRampToValueAtTime(.35,c.currentTime+t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.16);
        o.start(c.currentTime+t);o.stop(c.currentTime+t+.17);
      });
    }catch(e){}
  }
  function notify(msg){
    const n=document.createElement("div");
    n.textContent=msg;
    n.style.cssText="position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#d9a24e;color:#20160a;padding:13px 22px;border-radius:12px;font-weight:600;font-family:-apple-system,Segoe UI,sans-serif;font-size:14px;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.4)";
    document.body.appendChild(n);
    setTimeout(()=>{n.style.transition="opacity .4s";n.style.opacity="0";setTimeout(()=>n.remove(),400);},4000);
  }

  /* ---------- quotes ---------- */
  const quotes=[
    {t:"The secret of getting ahead is getting started.",a:"Mark Twain"},
    {t:"Don't watch the clock; do what it does. Keep going.",a:"Sam Levenson"},
    {t:"Success is the sum of small efforts repeated day in and day out.",a:"Robert Collier"},
    {t:"The expert in anything was once a beginner.",a:"Helen Hayes"},
    {t:"Focus on being productive instead of busy.",a:"Tim Ferriss"},
    {t:"It always seems impossible until it's done.",a:"Nelson Mandela"},
    {t:"Study hard what interests you the most in the most undisciplined, irreverent way possible.",a:"Richard Feynman"},
    {t:"The beautiful thing about learning is that no one can take it away from you.",a:"B.B. King"},
    {t:"You don't have to be great to start, but you have to start to be great.",a:"Zig Ziglar"},
    {t:"Discipline is the bridge between goals and accomplishment.",a:"Jim Rohn"},
    {t:"Small progress is still progress.",a:"Unknown"},
    {t:"Concentrate all your thoughts upon the work at hand.",a:"Alexander Graham Bell"}
  ];
  let qi=Math.floor(Date.now()/86400000)%quotes.length;
  function showQuote(i){const q=quotes[i%quotes.length];$("#quoteText").textContent="“"+q.t+"”";$("#quoteAuthor").textContent="— "+q.a;}
  showQuote(qi);
  $("#newQuote").addEventListener("click",()=>{qi=(qi+1)%quotes.length;showQuote(qi);});

  /* ---------- tasks ---------- */
  function renderTasks(){
    const list=$("#taskList");list.innerHTML="";
    if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet.</div>';return;}
    tasks.forEach((t,i)=>{
      const li=document.createElement("li");
      if(t.done)li.classList.add("done");
      li.innerHTML='<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div><span class="tname"></span><button class="del" aria-label="Remove">×</button>';
      li.querySelector(".tname").textContent=t.text;
      li.querySelector(".check").addEventListener("click",()=>{tasks[i].done=!tasks[i].done;store.set("tasks",tasks);renderTasks();});
      li.querySelector(".del").addEventListener("click",()=>{tasks.splice(i,1);store.set("tasks",tasks);renderTasks();});
      list.appendChild(li);
    });
  }
  function addTask(){const inp=$("#taskInput"),v=inp.value.trim();if(!v)return;tasks.push({text:v,done:false});store.set("tasks",tasks);renderTasks();inp.value="";inp.focus();}
  $("#addTask").addEventListener("click",addTask);
  $("#taskInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});
  renderTasks();

  /* ---------- sounds (Web Audio, offline) ---------- */
  let ac=null,noise=null,gain=null,birds=null,active=null;
  let volume=store.get("volume",45);$("#volume").value=volume;
  function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}
  function noiseBuf(){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}return b;}
  function stopSound(){if(noise){try{noise.stop();}catch(e){}noise.disconnect();noise=null;}if(birds){clearInterval(birds);birds=null;}active=null;document.querySelectorAll(".track").forEach(t=>t.classList.remove("active"));}
  function play(kind,el){
    ctx();
    if(active===kind){stopSound();return;}
    stopSound();active=kind;el.classList.add("active");
    gain=ac.createGain();gain.gain.value=volume/100*.6;gain.connect(ac.destination);
    if(kind==="forest"){
      const s=ac.createBufferSource();s.buffer=noiseBuf();s.loop=true;
      const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=700;
      const g2=ac.createGain();g2.gain.value=.25;s.connect(f);f.connect(g2);g2.connect(gain);s.start();noise=s;
      birds=setInterval(()=>{if(Math.random()<.6){const o=ac.createOscillator(),cg=ac.createGain(),base=1400+Math.random()*1400;o.type="sine";o.frequency.value=base;o.connect(cg);cg.connect(gain);const now=ac.currentTime;cg.gain.setValueAtTime(.0001,now);cg.gain.exponentialRampToValueAtTime(.15,now+.03);o.frequency.exponentialRampToValueAtTime(base*1.3,now+.08);cg.gain.exponentialRampToValueAtTime(.0001,now+.2);o.start(now);o.stop(now+.22);}},900);
      return;
    }
    const s=ac.createBufferSource();s.buffer=noiseBuf();s.loop=true;
    const f=ac.createBiquadFilter();
    if(kind==="rain"){f.type="highpass";f.frequency.value=1000;}
    else if(kind==="ocean"){f.type="lowpass";f.frequency.value=500;}
    else{f.type="bandpass";f.frequency.value=600;f.Q.value=.5;}
    s.connect(f);f.connect(gain);s.start();noise=s;
    if(kind==="ocean"){const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.12;lg.gain.value=.25;lfo.connect(lg);lg.connect(gain.gain);lfo.start();}
  }
  document.querySelectorAll(".track").forEach(t=>t.addEventListener("click",()=>play(t.dataset.sound,t)));
  $("#volume").addEventListener("input",e=>{volume=+e.target.value;store.set("volume",volume);if(gain)gain.gain.value=volume/100*.6;});

  /* ---------- collapsible panels ---------- */
  document.querySelectorAll(".panel").forEach(p=>{
    const key=p.dataset.panel;
    if(openPanels[key])p.classList.add("open");
    p.querySelector(".panel-head").addEventListener("click",()=>{
      p.classList.toggle("open");
      openPanels[key]=p.classList.contains("open");
      store.set("openPanels",openPanels);
    });
  });

  /* ---------- settings ---------- */
  function applyDur(){for(const k of ["focus","short","long"])$("#dur-"+k).textContent=settings.dur[k];if(!running){total=settings.dur[mode]*60;remaining=total;render();}}
  document.querySelectorAll("[data-dur]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.dur,d=+b.dataset.d;settings.dur[k]=Math.max(1,Math.min(90,settings.dur[k]+d));store.set("settings",settings);applyDur();}));
  $("#alertToggle").addEventListener("change",e=>{settings.alert=e.target.checked;store.set("settings",settings);});
  $("#clock24").addEventListener("change",e=>{settings.clock24=e.target.checked;store.set("settings",settings);tickClock();});
  $("#openSettings").addEventListener("click",()=>{$("#drawer").classList.add("open");$("#overlay").classList.add("open");});
  function closeS(){$("#drawer").classList.remove("open");$("#overlay").classList.remove("open");}
  $("#closeSettings").addEventListener("click",closeS);
  $("#overlay").addEventListener("click",closeS);
  $("#resetAll").addEventListener("click",()=>{if(confirm("Reset all settings, tasks, and progress?")){localStorage.clear();location.reload();}});

  /* ---------- init ---------- */
  $("#alertToggle").checked=settings.alert;
  $("#clock24").checked=settings.clock24;
  $("#dim").value=bg.dim;$("#dimVal").textContent=bg.dim+"%";
  applyBg();buildSwatches();applyDur();setMode("focus");
})();
</script>
</body>
</html>
