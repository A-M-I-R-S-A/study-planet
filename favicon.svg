<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Study Planet">
  <!-- Study Planet's mark. One file, linked from every page, so the tab icon is the
       same drawing everywhere rather than a second copy that can drift.
       The dark rounded square is here and not in the inline logo: a favicon needs its
       own ground to read against a browser's chrome, the in-page mark does not.

       Drawn on a 64-unit grid rather than 32: the detail below (ring gaps, cloud
       bands, the shadow the planet throws across its own rings) needs sub-pixel
       coordinates to stay clean, and an SVG costs nothing to scale.

       Everything is lit from the upper left and tilted -20°, the same tilt the
       wordmark uses. The ring is drawn twice — once behind the globe, once in
       front — because a ring that only passes behind reads as a flat halo. -->
  <defs>
    <radialGradient id="sky" cx="32%" cy="20%" r="96%">
      <stop offset="0%" stop-color="#161d4a"/>
      <stop offset="52%" stop-color="#0a0e29"/>
      <stop offset="100%" stop-color="#04050f"/>
    </radialGradient>
    <radialGradient id="neb">
      <stop offset="0%" stop-color="#7a5cf0" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#7a5cf0" stop-opacity="0"/>
    </radialGradient>

    <!-- the globe: cream at the sub-solar point, falling through amber to a cold plum limb -->
    <radialGradient id="surface" cx="33%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#fff3d8"/>
      <stop offset="26%" stop-color="#f8ca8b"/>
      <stop offset="58%" stop-color="#e18a4d"/>
      <stop offset="84%" stop-color="#a5484f"/>
      <stop offset="100%" stop-color="#5d2345"/>
    </radialGradient>
    <!-- two separate darkenings: one all around (limb), one away from the sun (night) -->
    <radialGradient id="limb" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#180a22" stop-opacity="0"/>
      <stop offset="100%" stop-color="#180a22" stop-opacity=".34"/>
    </radialGradient>
    <radialGradient id="night" cx="32%" cy="26%" r="82%">
      <stop offset="42%" stop-color="#04050f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050f" stop-opacity=".74"/>
    </radialGradient>
    <radialGradient id="spec">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="storm" cx="42%" cy="38%">
      <stop offset="0%" stop-color="#c65b48" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#8d2f3c" stop-opacity="0"/>
    </radialGradient>
    <!-- thin blue shell of atmosphere, brightest where it catches the light -->
    <radialGradient id="halo">
      <stop offset="66%" stop-color="#7ebeff" stop-opacity="0"/>
      <stop offset="75%" stop-color="#7ebeff" stop-opacity=".3"/>
      <stop offset="84%" stop-color="#7ebeff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#7ebeff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="46" y1="43" x2="20" y2="19">
      <stop offset="0%" stop-color="#a8d6ff" stop-opacity=".8"/>
      <stop offset="58%" stop-color="#a8d6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="34%" cy="30%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="62%" stop-color="#9aa5c4"/>
      <stop offset="100%" stop-color="#2c3154"/>
    </radialGradient>

    <!-- Ring brightness runs along the ring's own axis, so it is measured in the
         rotated frame the ring is drawn in. The dip near 64% is the planet's
         shadow falling across the far side. -->
    <linearGradient id="ringlight" gradientUnits="userSpaceOnUse" x1="4" y1="31" x2="60" y2="31">
      <stop offset="0%" stop-color="#a8ceff" stop-opacity=".42"/>
      <stop offset="18%" stop-color="#d6eaff" stop-opacity=".78"/>
      <stop offset="42%" stop-color="#e8f2ff" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#c8e0ff" stop-opacity=".8"/>
      <stop offset="64%" stop-color="#6084c4" stop-opacity=".26"/>
      <stop offset="75%" stop-color="#bcd8ff" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#96beFA" stop-opacity=".4"/>
    </linearGradient>

    <!-- four bands and two gaps; the widths are what survives at 16px -->
    <g id="ring" fill="none" stroke="url(#ringlight)">
      <ellipse cx="32" cy="31" rx="27.6" ry="9.3" stroke-width="1.2" stroke-opacity=".55"/>
      <ellipse cx="32" cy="31" rx="25.2" ry="8.5" stroke-width="3.4"/>
      <ellipse cx="32" cy="31" rx="21.4" ry="7.2" stroke-width="2.2" stroke-opacity=".72"/>
      <ellipse cx="32" cy="31" rx="18.9" ry="6.4" stroke-width="1" stroke-opacity=".34"/>
    </g>

    <clipPath id="globe"><circle cx="32" cy="31" r="15"/></clipPath>
    <!-- split along the ring's major axis: above it is the far side, below the near -->
    <clipPath id="ringback"><rect x="-24" y="-24" width="112" height="55"/></clipPath>
    <clipPath id="ringfront"><rect x="-24" y="31" width="112" height="57"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#sky)"/>
  <ellipse cx="11" cy="52" rx="27" ry="19" fill="url(#neb)"/>

  <g fill="#ffffff">
    <circle cx="7.4" cy="10.2" r=".9" opacity=".85"/>
    <circle cx="14.6" cy="21.4" r=".55" opacity=".5"/>
    <circle cx="52.2" cy="7.8" r=".7" opacity=".7"/>
    <circle cx="57.4" cy="16.6" r=".5" opacity=".45"/>
    <circle cx="9.8" cy="52.6" r=".7" opacity=".6"/>
    <circle cx="26.4" cy="56.8" r=".5" opacity=".45"/>
    <circle cx="47.6" cy="55.2" r=".8" opacity=".75"/>
    <circle cx="58.2" cy="46.4" r=".55" opacity=".5"/>
  </g>

  <g transform="translate(13.4 13.4)">
    <circle r="2.6" fill="url(#moon)"/>
    <circle cx=".9" cy=".95" r=".55" fill="#101430" opacity=".22"/>
  </g>

  <circle cx="32" cy="31" r="21" fill="url(#halo)"/>

  <g transform="rotate(-20 32 31)"><g clip-path="url(#ringback)"><use href="#ring"/></g></g>

  <g clip-path="url(#globe)">
    <circle cx="32" cy="31" r="15" fill="url(#surface)"/>
    <!-- Cloud bands sag toward the viewer at mid-disc because the rings are tilted
         toward us: we are looking at the planet from slightly above its equator. -->
    <g transform="rotate(-20 32 31)" fill="none" stroke-linecap="round">
      <path d="M18 18.4Q32 20.6 46 18.4" stroke="#6b2a3f" stroke-opacity=".2" stroke-width="1.6"/>
      <path d="M15.5 21.6Q32 24.2 48.5 21.6" stroke="#fff0cf" stroke-opacity=".2" stroke-width="2"/>
      <path d="M14.2 25.4Q32 28.2 49.8 25.4" stroke="#6b2a3f" stroke-opacity=".26" stroke-width="2.6"/>
      <path d="M13.6 29.6Q32 32.4 50.4 29.6" stroke="#ffe6bd" stroke-opacity=".22" stroke-width="3.4"/>
      <path d="M13.8 34.2Q32 37 50.2 34.2" stroke="#5e2440" stroke-opacity=".24" stroke-width="2.8"/>
      <path d="M15.2 38.4Q32 41 48.8 38.4" stroke="#ffe0b4" stroke-opacity=".16" stroke-width="2.2"/>
      <path d="M18.5 41.8Q32 43.8 45.5 41.8" stroke="#5e2440" stroke-opacity=".2" stroke-width="1.6"/>
      <ellipse cx="26" cy="34.8" rx="3.6" ry="2.2" fill="url(#storm)" stroke="none"/>
      <!-- the rings' own shadow, thrown back onto the clouds just off the equator -->
      <path d="M17.5 32.4Q32 35.2 46.5 32.4" stroke="#1d0a20" stroke-opacity=".34" stroke-width="2.2"/>
    </g>
    <circle cx="32" cy="31" r="15" fill="url(#limb)"/>
    <circle cx="32" cy="31" r="15" fill="url(#night)"/>
    <ellipse cx="25.4" cy="24.2" rx="5.2" ry="3.4" fill="url(#spec)" transform="rotate(-32 25.4 24.2)"/>
  </g>
  <circle cx="32" cy="31" r="14.7" fill="none" stroke="url(#rim)" stroke-width="1.1"/>

  <g transform="rotate(-20 32 31)"><g clip-path="url(#ringfront)"><use href="#ring"/></g></g>
</svg>
