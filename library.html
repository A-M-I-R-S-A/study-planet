<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303a">
<title>Focus — Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:oklch(0.72 0.13 62);--accent-2:oklch(0.66 0.11 220);--accent-ink:#16303a;
    --cream:#faf6ee;--cream2:#efe9de;--cream3:#e6ddcd;
    --ink:#2b2824;--muted:#8a8175;--white:#fbfdfd;--danger:#c0392b;--good:#3a9d5d;
    --shadow:0 18px 46px rgba(0,0,0,.30);--radius:22px;
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  :focus:not(:focus-visible){outline:none}
  html[lang="fa"] body{font-family:'Lalezar','Vazirmatn','Segoe UI',Tahoma,sans-serif}
  html[lang="fa"] h1,html[lang="fa"] h2{letter-spacing:normal;text-transform:none}
  html,body{height:100%}
  body{margin:0;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);background:#16303a;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;top:-18%;left:-12%;width:52vw;height:52vw;border-radius:50%;
    background:radial-gradient(circle,oklch(0.72 0.13 62 / .28),transparent 68%);z-index:0;pointer-events:none}
  body::after{content:"";position:fixed;bottom:-22%;right:-16%;width:58vw;height:58vw;border-radius:50%;
    background:radial-gradient(circle,oklch(0.66 0.11 220 / .22),transparent 68%);z-index:0;pointer-events:none}
  .mono{font-family:'DM Mono',ui-monospace,monospace}
  .wrap{position:relative;z-index:1;max-width:840px;margin:0 auto;
    padding:calc(clamp(18px,4vw,42px) + env(safe-area-inset-top)) max(clamp(18px,4vw,42px),env(safe-area-inset-right)) calc(clamp(18px,4vw,42px) + env(safe-area-inset-bottom)) max(clamp(18px,4vw,42px),env(safe-area-inset-left))}
  /* Same inset contract as the other pages: a floor for WebViews that report no status-bar
     inset, and none at all in fullscreen where there is no bar to clear. */
  html.native:not(.fs) .wrap{padding-top:calc(clamp(16px,4vw,42px) + max(env(safe-area-inset-top),26px))}
  html.native.fs .wrap{padding-top:calc(clamp(16px,4vw,42px) + env(safe-area-inset-top))}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-badge{width:50px;height:50px;border-radius:15px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:25px;
    background:linear-gradient(150deg,var(--accent),color-mix(in oklch,var(--accent) 55%,#e08a3c));
    box-shadow:0 8px 22px rgba(224,138,60,.4),inset 0 1px 0 rgba(255,255,255,.4)}
  .brand h1{font-size:23px;font-weight:700;color:var(--white);letter-spacing:-.02em;margin:0;line-height:1.1}
  .brand .tagline{font-size:13px;color:rgba(255,255,255,.6);margin-top:3px}
  .hbtns{display:flex;gap:9px;flex-wrap:wrap}
  .hbtn{height:42px;padding:0 15px;border-radius:12px;border:1px solid rgba(255,255,255,.24);
    background:rgba(255,255,255,.12);color:var(--white);font-size:13.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:7px;text-decoration:none;backdrop-filter:blur(10px);transition:.16s}
  .hbtn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}

  .panel{background:linear-gradient(180deg,#fefcf8,var(--cream));border:1px solid rgba(255,255,255,.5);
    border-radius:var(--radius);padding:20px 20px 18px;box-shadow:var(--shadow);margin-bottom:18px;
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 15px}
  .panel-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;
    font-weight:700;display:flex;align-items:center;gap:9px}
  .panel-head h2::before{content:"";width:16px;height:2.5px;border-radius:2px;background:var(--accent)}
  .hint{font-size:12px;color:var(--muted);font-weight:500}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.6;margin:-8px 0 14px}

  .btn{border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:13.5px;padding:10px 16px;
    transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;font-family:inherit}
  .btn.pri{background:linear-gradient(150deg,var(--accent),color-mix(in oklch,var(--accent) 58%,#e08a3c));
    color:var(--accent-ink);box-shadow:0 6px 16px rgba(224,138,60,.32)}
  .btn.pri:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn.ghost{background:var(--cream2);border:1px solid rgba(0,0,0,.1);color:var(--ink)}
  .btn.ghost:hover{background:#fff}
  .btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

  /* ---------- the shelf ---------- */
  .shelfbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;
    padding:12px 14px;backdrop-filter:blur(10px)}
  .shelfbar .who{color:var(--white);font-size:14px;font-weight:600;flex:1;min-width:0}
  .shelfbar .who span{display:block;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.6);margin-top:2px}
  .shelfbar .hbtn{height:36px;font-size:12.5px}

  .files{display:flex;flex-direction:column;gap:10px}
  .file{display:flex;align-items:center;gap:13px;background:var(--cream2);border-radius:16px;padding:13px 14px;
    border:1px solid transparent;transition:transform .16s,box-shadow .16s,border-color .16s;
    animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .file:hover{transform:translateY(-2px);border-color:rgba(0,0,0,.08);box-shadow:0 12px 26px rgba(0,0,0,.14)}
  .file .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:21px;flex:none;background:linear-gradient(150deg,#eab962,#dd8a3f);color:#3a2410;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px rgba(0,0,0,.14)}
  .file .info{flex:1;min-width:0}
  .file .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
  .file .ds{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
  .file .meta{display:flex;gap:7px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;
    border-radius:99px;background:rgba(0,0,0,.05);color:var(--muted)}
  .file .acts{display:flex;gap:7px;flex:none}

  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 0;line-height:1.6}
  .empty .big{font-size:32px;display:block;margin-bottom:8px;opacity:.8}
  .msg{font-size:13px;margin-top:11px;min-height:16px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--good)}

  /* ---------- education editor ---------- */
  .edu-grid{display:grid;gap:12px}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .stage-card{border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:14px;padding:13px 8px;
    cursor:pointer;font-family:inherit;color:var(--ink);display:grid;gap:2px;justify-items:center;transition:.15s}
  .stage-card .ic{font-size:21px;line-height:1.1}
  .stage-card b{font-size:13.5px;font-weight:600}
  .stage-card i{font-style:normal;font-size:11px;color:var(--muted)}
  .stage-card[aria-pressed="true"]{border-color:var(--accent);
    background:color-mix(in oklch,var(--accent) 12%,#fff);
    box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 20%,transparent)}
  label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 2px 6px;font-weight:600}
  select,.edu-grid input{width:100%;border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:12px;
    padding:12px 14px;font-size:14.5px;color:var(--ink);outline:none;font-family:inherit;transition:.15s}
  select:focus,.edu-grid input:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 20%,transparent)}
  .hidden{display:none !important}
  .loading{text-align:center;padding:60px 0;color:rgba(255,255,255,.75);font-size:14px}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 15px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  @media (max-width:520px){
    .file{align-items:flex-start;flex-wrap:wrap}
    .file .acts{width:100%;margin-top:4px}
    .file .acts .btn{flex:1}
  }

  /* ---------- appearance: Glass ----------
     Same contract as the rest of the app: theme.js puts .glass on <html> from prefs.glass, and
     without it nothing above changes. .panel is the only card shell here, so redefining the
     surface tokens on it repaints the page; the rest is the literals no token reaches. */
  html.glass .panel{
    --cream:rgba(18,24,30,.68);
    --cream2:rgba(255,255,255,.07);
    --cream3:rgba(255,255,255,.22);
    --ink:#f1f5f8;
    --muted:rgba(233,240,246,.58);
    --danger:#ff7a6a;
    --good:#5ec488;
    background:var(--cream);
    border:1px solid rgba(255,255,255,.14);
    color:var(--ink);
    backdrop-filter:blur(26px) saturate(1.5);
    -webkit-backdrop-filter:blur(26px) saturate(1.5);
    box-shadow:0 24px 64px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.1);
  }
  html.glass .panel ::placeholder{color:rgba(233,240,246,.42)}
  html.glass .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
  html.glass .btn.ghost:hover{background:rgba(255,255,255,.18)}
  html.glass .file:hover{border-color:rgba(255,255,255,.18);box-shadow:0 12px 26px rgba(0,0,0,.3)}
  html.glass .chip{background:rgba(255,255,255,.1)}
  html.glass select,html.glass .edu-grid input,html.glass .stage-card{
    background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--ink)}
  html.glass select option{background:#182028;color:#f1f5f8}
  html.glass .stage-card[aria-pressed="true"]{
    background:color-mix(in oklch,var(--accent) 26%,rgba(255,255,255,.08));border-color:var(--accent)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    html.glass .panel{--cream:rgba(18,24,30,.95)}
  }
</style>
</head>
<body>
  <script src="/theme.js"></script>
  <script src="/i18n.js"></script>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-badge">📚</div>
        <div>
          <h1 data-i18n="library">Library</h1>
          <div class="tagline" data-i18n="library_sub">Study material chosen for you</div>
        </div>
      </div>
      <div class="hbtns">
        <a class="hbtn" href="/">⏱ <span data-i18n="timer">Timer</span></a>
        <a class="hbtn" href="/dashboard">📊 <span data-i18n="dashboard">Dashboard</span></a>
        <a class="hbtn" href="/rooms">👥 <span data-i18n="rooms">Rooms</span></a>
      </div>
    </header>

    <div id="root">
      <div class="loading"><div class="spinner"></div><span data-i18n="lib_loading">Opening your library…</span></div>
    </div>
  </div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var I=window.FocusI18n, t=function(k){return I.t(k);};
var root=$("#root");
document.title="Focus — "+t("library");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* An icon per family rather than per extension: what a student needs to know at a glance is
   "slides or a worksheet", not which Office version wrote it. */
var ICONS={pdf:"📕",doc:"📄",docx:"📄",txt:"📃",md:"📃",csv:"📊",xlsx:"📊",pptx:"🖥",
           epub:"📗",zip:"🗜",jpg:"🖼",png:"🖼",gif:"🖼",webp:"🖼"};
function icon(ext){return ICONS[ext]||"📁";}
function size(bytes){
  bytes=Math.max(0,bytes||0);
  if(bytes<1024) return I.num(bytes)+" B";
  if(bytes<1024*1024) return I.num(Math.round(bytes/1024))+" KB";
  return I.num((bytes/1048576).toFixed(1))+" MB";
}
function files(n){return I.tf(n===1?"lib_files_one":"lib_files_many",I.num(n));}

/* Inside the Android shell there is one WebView and no tabs. target="_blank" there is worse
   than useless: Capacitor hands the URL to the system browser, which carries none of this
   session's cookies, so an "Open" that looked fine on the web came back as a sign-in error
   on a phone. The WebView cannot render a PDF either. So the app gets a single action —
   Download — which MainActivity's DownloadListener passes to Android's DownloadManager,
   notification and tap-to-open included. On the web both actions stay as they were. */
var NATIVE=!!window.Capacitor;

function fileCard(it){
  return '<div class="file">'+
    '<div class="ic">'+icon(it.ext)+'</div>'+
    '<div class="info">'+
      '<div class="nm">'+esc(it.title)+'</div>'+
      (it.description?'<div class="ds">'+esc(it.description)+'</div>':'')+
      '<div class="meta"><span class="chip">'+esc(it.ext||"file")+'</span>'+
        '<span class="chip">'+esc(size(it.size))+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="acts">'+
      /* rel=noopener because this one opens a tab; the download variant asks the server for
         an attachment disposition rather than trying to force one from the page. */
      (NATIVE?'':'<a class="btn ghost sm" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+
        t("lib_open")+'</a>')+
      '<a class="btn pri sm" href="'+esc(it.url)+'?dl=1">'+t("lib_download")+'</a>'+
    '</div></div>';
}

function shelf(d){
  var cats=d.categories||[], items=d.items||[];
  var label=I.eduLabel(d.education)||"";
  var html='<div class="shelfbar">'+
    '<div class="who">'+(label?esc(I.tf("lib_shelf_for",label)):esc(t("lib_empty_edu")))+
      '<span>'+esc(files(items.length))+'</span></div>'+
    '<button class="hbtn" id="editEdu">✎ '+t("lib_set_edu")+'</button>'+
  '</div>';

  if(!d.enabled){
    return html+'<div class="panel"><div class="empty"><span class="big">🔒</span>'+esc(t("lib_off"))+'</div></div>';
  }
  if(!items.length){
    // Two different silences: nothing has been published for this grade yet, or we don't
    // know the grade — only the second one is something the student can fix.
    var why=d.education&&d.education.complete?t("lib_empty"):t("lib_empty_edu");
    return html+'<div class="panel"><div class="empty"><span class="big">📚</span>'+esc(why)+'</div></div>';
  }

  cats.forEach(function(c){
    var mine=items.filter(function(i){return i.categoryId===c.id;});
    if(!mine.length) return;
    html+='<section class="panel"><div class="panel-head"><h2>'+esc(c.name)+'</h2>'+
      '<span class="hint">'+esc(files(mine.length))+'</span></div>'+
      (c.description?'<div class="desc">'+esc(c.description)+'</div>':'')+
      '<div class="files">'+mine.map(fileCard).join("")+'</div></section>';
  });
  var loose=items.filter(function(i){return !i.categoryId;});
  if(loose.length){
    // Only call it "other" when there are folders to be other *than*; on a shelf with no
    // categories at all, a heading saying "other material" is just noise.
    html+='<section class="panel"><div class="panel-head"><h2>'+
      esc(cats.length?t("lib_other"):t("library"))+'</h2>'+
      '<span class="hint">'+esc(files(loose.length))+'</span></div>'+
      '<div class="files">'+loose.map(fileCard).join("")+'</div></section>';
  }
  return html;
}

/* ---- editing what you study ----
   The same three questions the signup form asks, in the same order, so changing your grade
   later is the screen you already know. It saves through PATCH /api/profile, which merges
   rather than replaces — sending only education leaves name and avatar alone. */
function eduEditor(current,onDone){
  var edu={stage:current.stage||"",grade:current.grade||"",major:current.major||""};
  var opts=function(keys,label,cur){
    return '<option value="">'+t("edu_pick")+'</option>'+keys.map(function(k){
      return '<option value="'+k+'"'+(cur===k?' selected':'')+'>'+esc(label(k))+'</option>';}).join("");
  };
  root.innerHTML='<section class="panel"><div class="panel-head"><h2>'+esc(t("edu_q"))+'</h2></div>'+
    '<div class="edu-grid">'+
      '<div class="stage" id="stage">'+
        '<button type="button" class="stage-card" data-stage="school"><span class="ic">🎒</span>'+
          '<b>'+esc(t("edu_school"))+'</b><i>'+esc(t("edu_school_sub"))+'</i></button>'+
        '<button type="button" class="stage-card" data-stage="uni"><span class="ic">🎓</span>'+
          '<b>'+esc(t("edu_uni"))+'</b><i>'+esc(t("edu_uni_sub"))+'</i></button>'+
      '</div>'+
      '<div class="hidden" id="schoolBox">'+
        '<label class="lbl" for="grade">'+esc(t("edu_grade"))+'</label>'+
        '<select id="grade">'+opts(I.GRADES,I.eduGrade,edu.grade)+'</select>'+
        '<div class="hidden" style="margin-top:12px" id="majorBox">'+
          '<label class="lbl" for="major">'+esc(t("edu_major"))+'</label>'+
          '<select id="major">'+opts(I.MAJORS,I.eduMajor,edu.major)+'</select></div>'+
        '<div class="hint hidden" style="margin-top:8px" id="majorHint">'+esc(t("edu_no_major"))+'</div>'+
      '</div>'+
      '<div class="hidden" id="uniBox">'+
        '<label class="lbl" for="uniMajor">'+esc(t("edu_uni_major"))+'</label>'+
        '<input id="uniMajor" type="text" maxlength="60" placeholder="'+esc(t("edu_uni_major_ph"))+
          '" value="'+esc(edu.stage==="uni"?edu.major:"")+'"></div>'+
      '<div class="hint">'+esc(t("edu_why"))+'</div>'+
      '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
        '<button class="btn pri" id="eduSave">'+esc(t("save"))+'</button>'+
        '<button class="btn ghost" id="eduBack">'+esc(t("library"))+'</button>'+
      '</div>'+
      '<div class="msg" id="eduMsg"></div>'+
    '</div></section>';

  var msg=$("#eduMsg");
  function draw(){
    Array.prototype.forEach.call($("#stage").children,function(b){
      b.setAttribute("aria-pressed",String(b.getAttribute("data-stage")===edu.stage));
    });
    $("#schoolBox").classList.toggle("hidden",edu.stage!=="school");
    $("#uniBox").classList.toggle("hidden",edu.stage!=="uni");
    var wants=edu.stage==="school"&&edu.grade&&I.hasMajor(edu.grade);
    $("#majorBox").classList.toggle("hidden",!wants);
    $("#majorHint").classList.toggle("hidden",!(edu.stage==="school"&&edu.grade&&!I.hasMajor(edu.grade)));
  }
  Array.prototype.forEach.call($("#stage").children,function(b){
    b.onclick=function(){edu.stage=b.getAttribute("data-stage");draw();};
  });
  $("#grade").onchange=function(){
    edu.grade=this.value;
    if(!I.hasMajor(edu.grade)){edu.major="";$("#major").value="";}
    draw();
  };
  $("#major").onchange=function(){edu.major=this.value;};
  draw();

  $("#eduBack").onclick=function(){onDone();};
  $("#eduSave").onclick=function(){
    var fail=function(k){msg.textContent=t(k);msg.className="msg err";};
    var body;
    if(!edu.stage) return fail("edu_need_stage");
    if(edu.stage==="uni"){
      var m=$("#uniMajor").value.trim();
      if(!m) return fail("edu_need_uni_major");
      body={stage:"uni",major:m};
    }else{
      if(!edu.grade) return fail("edu_need_grade");
      if(I.hasMajor(edu.grade)&&!edu.major) return fail("edu_need_major");
      body={stage:"school",grade:edu.grade,major:I.hasMajor(edu.grade)?edu.major:""};
    }
    var btn=this; btn.disabled=true;
    fetch("/api/profile",{method:"PATCH",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({education:body})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(r){
        btn.disabled=false;
        if(!r.ok){msg.textContent=r.j.error?I.serverError(r.j.error):t("generic_error");msg.className="msg err";return;}
        msg.textContent=t("edu_saved");msg.className="msg ok";
        onDone();
      })
      .catch(function(){btn.disabled=false;msg.textContent=t("no_server");msg.className="msg err";});
  };
}

function load(){
  root.innerHTML='<div class="loading"><div class="spinner"></div>'+esc(t("lib_loading"))+'</div>';
  fetch("/api/library",{credentials:"same-origin"})
    .then(function(r){
      if(r.status===401){location.href="/login?next=/library";throw new Error("auth");}
      return r.json();
    })
    .then(function(d){
      root.innerHTML=shelf(d);
      var b=$("#editEdu");
      if(b) b.onclick=function(){eduEditor(d.education||{},load);};
    })
    .catch(function(e){
      if(e&&e.message==="auth") return;
      root.innerHTML='<div class="panel"><div class="empty"><span class="big">📡</span>'+
        esc(t("no_server_running"))+'</div></div>';
    });
}
load();
})();
</script>
</body>
</html>
