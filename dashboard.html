<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303a">
<title>Focus — Your dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{--accent:oklch(0.7 0.12 62);--accent-ink:#16303a;--cream:#faf6ee;--cream2:#efe9de;--ink:#2b2824;--muted:#8a8175;--white:#fbfdfd;--danger:#c0392b}
  *{box-sizing:border-box}
  /* Kill the grey/blue rectangle Android's WebView flashes over anything tapped, and the
     focus ring left behind after a tap. :focus-visible keeps the ring for keyboard users. */
  html{-webkit-tap-highlight-color:transparent}
  :focus:not(:focus-visible){outline:none}
  html[lang="fa"] body{font-family:'Lalezar','Vazirmatn','Segoe UI',Tahoma,sans-serif}
  html[lang="fa"] h2{letter-spacing:normal;text-transform:none}
  html,body{height:100%}
  body{margin:0;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:#16303a;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .mono{font-family:'DM Mono',ui-monospace,monospace}
  .wrap{max-width:920px;margin:0 auto;padding:calc(clamp(18px,4vw,40px) + env(safe-area-inset-top)) max(clamp(18px,4vw,40px),env(safe-area-inset-right)) calc(clamp(18px,4vw,40px) + env(safe-area-inset-bottom)) max(clamp(18px,4vw,40px),env(safe-area-inset-left))}

  /* See index.html: floor for WebViews that report no status-bar inset, and no floor at all
     in fullscreen, where there is no bar to clear. */
  html.native:not(.fs) .wrap{padding-top:calc(clamp(16px,4vw,40px) + max(env(safe-area-inset-top),26px))}
  html.native.fs .wrap{padding-top:calc(clamp(16px,4vw,40px) + env(safe-area-inset-top))}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
  .who{display:flex;align-items:center;gap:13px}
  .avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:26px;backdrop-filter:blur(8px)}
  .who .nm{font-size:20px;font-weight:600;color:var(--white);letter-spacing:-.01em}
  .who .em{font-size:13px;color:rgba(255,255,255,.66);margin-top:1px}
  .hbtns{display:flex;gap:9px}
  .hbtn{height:42px;padding:0 16px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:var(--white);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;text-decoration:none;backdrop-filter:blur(8px)}
  .hbtn:hover{background:rgba(255,255,255,.24)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--cream);border-radius:20px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.26)}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
  .stat .v{font-size:34px;line-height:1;margin-top:12px;color:var(--ink)}
  .stat .v small{font-size:16px;color:var(--muted)}
  .stat.hl{background:linear-gradient(150deg,var(--accent),color-mix(in oklch,var(--accent) 62%,#e08a3c));color:var(--accent-ink)}
  .stat.hl .k{color:rgba(22,48,58,.7)}
  .stat.hl .v{color:var(--accent-ink)}

  .section{background:var(--cream);border-radius:22px;padding:22px 22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.26);margin-bottom:22px}
  .section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 18px}

  /* chart */
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0}
  .bar .fill{width:100%;max-width:26px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s ease;position:relative}
  .bar.today .fill{box-shadow:0 0 0 2px var(--ink)}
  .bar .d{font-size:10px;color:var(--muted);white-space:nowrap}
  .bar .mv{font-size:10px;color:var(--muted);opacity:0;transition:.15s}
  .bar:hover .mv{opacity:1}
  .chart-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:40px 0}

  /* personalized items */
  .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .item{background:var(--cream2);border-radius:14px;padding:14px}
  .item .il{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .item .iv{font-size:15px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:8px}
  .swatch{width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.15);flex:none}

  /* profile editor */
  .prof{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .prof .fld{flex:1;min-width:180px}
  .prof label{display:block;font-size:12px;color:var(--muted);margin:0 2px 6px}
  .prof input{width:100%;border:1px solid rgba(0,0,0,.14);background:#fff;border-radius:11px;padding:11px 12px;font-size:14px;color:var(--ink);outline:none}
  .prof input:focus{border-color:var(--accent)}
  .avs{display:flex;flex-wrap:wrap;gap:6px}
  .av{width:38px;height:38px;border-radius:11px;border:1px solid rgba(0,0,0,.12);background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .av.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .save{height:44px;padding:0 22px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer}
  .save.saved{background:#2e7d46;color:#fff}

  /* subjects */
  .subj-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .subj-add input{flex:1;min-width:150px;border:1px solid rgba(0,0,0,.14);background:#fff;border-radius:11px;padding:11px 13px;font-size:14px;color:var(--ink);outline:none}
  .subj-add input:focus{border-color:var(--accent)}
  .color-pick{display:flex;gap:5px}
  .color-pick button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .color-pick button.on{border-color:var(--ink)}
  .subj-list{display:flex;flex-direction:column;gap:8px}
  .subj-row{display:flex;align-items:center;gap:11px;background:var(--cream2);border-radius:12px;padding:12px 14px}
  .subj-row .cdot{width:12px;height:12px;border-radius:50%;flex:none}
  .subj-row .snm{flex:1;font-size:14.5px;font-weight:600}
  .subj-row .stime{font-size:15px;color:var(--accent)}
  .subj-row .del{border:none;background:none;color:#a89e8f;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
  .subj-row .del:hover{color:var(--danger)}
  .subj-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:12px 0}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head .mlabel{font-size:15px;font-weight:600;color:var(--ink)}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:32px;height:32px;border-radius:9px;border:1px solid rgba(0,0,0,.12);background:var(--cream2);cursor:pointer;font-size:16px;color:var(--ink);line-height:1}
  .cal-nav button:hover{background:#e7dfd1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
  .cal-cell{aspect-ratio:1;border-radius:10px;background:var(--cream2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;border:1.5px solid transparent}
  .cal-cell.empty{background:transparent}
  .cal-cell.has{cursor:pointer}
  .cal-cell.has:hover{filter:brightness(1.04)}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell.sel{box-shadow:0 0 0 2px var(--ink)}
  .cal-cell .dn{font-size:12px;color:var(--ink)}
  .cal-cell.dim .dn{color:#b9b1a4}
  .cal-cell .cm{font-size:9px;color:var(--accent-ink);font-family:'DM Mono',monospace;font-weight:500;white-space:nowrap;max-width:100%}
  /* "۴۵ دقیقه" is far longer than "45m", and the cell is a seventh of the grid. */
  html[lang="fa"] .cal-cell .cm{font-size:7.5px;letter-spacing:-.02em}
  .cal-day-detail{margin-top:16px;background:var(--cream2);border-radius:14px;padding:16px}
  .cal-day-detail h3{margin:0 0 10px;font-size:14px}
  .cal-day-detail .topic{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-top:1px solid rgba(0,0,0,.06)}
  .cal-day-detail .topic:first-of-type{border-top:none}
  .cal-day-detail .topic .b{color:var(--accent)}
  .cal-day-detail .topic .tn{flex:1;min-width:0;overflow-wrap:anywhere}
  .cal-day-detail .topic .tm{flex:none;color:var(--accent);font-size:13px}
  .cal-day-detail .none{color:var(--muted);font-size:13px}
  .loading{color:rgba(255,255,255,.8);text-align:center;padding:80px 0;font-size:15px}

  /* ---- responsive: phones ---- */
  @media(max-width:560px){
    .wrap{padding:calc(16px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
    header{gap:12px}
    .avatar{width:44px;height:44px;font-size:22px}
    .who .nm{font-size:18px}
    .who .em{font-size:12px}
    .hbtn{height:38px;padding:0 12px;font-size:13px}
    .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
    .stat .v{font-size:28px}
    .section{padding:18px 16px 16px;border-radius:18px}
    .prof .fld{min-width:140px}
    .cal-cell .dn{font-size:11px}
    .cal-cell .cm{font-size:8px}
  }
</style>
</head>
<body>
<script src="/theme.js"></script>
<script src="/i18n.js"></script>
<div class="wrap" id="wrap">
  <div class="loading" id="loading" data-i18n="loading_dash">Loading your dashboard…</div>
  <div id="content" style="display:none">
    <header>
      <div class="who">
        <div class="avatar" id="hAvatar">🦊</div>
        <div>
          <div class="nm" id="hName">—</div>
          <div class="em" id="hEmail">—</div>
        </div>
      </div>
      <div class="hbtns">
        <a class="hbtn" href="/">⏱ <span data-i18n="timer">Timer</span></a>
        <a class="hbtn" href="/rooms">👥 <span data-i18n="rooms">Rooms</span></a>
        <button class="hbtn" id="langBtn">🌐 <span id="langLabel">English</span></button>
        <button class="hbtn" id="logout" data-i18n="sign_out">Sign out</button>
      </div>
    </header>

    <div class="grid" id="statGrid"></div>

    <div class="section">
      <h2><span data-i18n="subjects">Subjects</span> <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)" data-i18n="subjects_sub">· focus time today</span></h2>
      <div class="subj-add">
        <input type="text" id="subjName" data-i18n-ph="subject_ph" placeholder="Add a subject (e.g. Calculus)" maxlength="40">
        <div class="color-pick" id="colorPick"></div>
        <button class="save" id="addSubj" data-i18n="add">Add</button>
      </div>
      <div class="subj-list" id="subjList"></div>
    </div>

    <div class="section">
      <h2 data-i18n="last14">Last 14 days · focus minutes</h2>
      <div id="chart"></div>
    </div>

    <div class="section">
      <h2 data-i18n="calendar">Study calendar</h2>
      <div class="cal-head">
        <div class="mlabel" id="calLabel">—</div>
        <div class="cal-nav"><button id="calPrev" data-i18n-title="prev_month" aria-label="Previous month">‹</button><button id="calNext" data-i18n-title="next_month" aria-label="Next month">›</button></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-day-detail" id="calDetail"><div class="none" data-i18n="pick_day">Pick a day to see what you studied.</div></div>
    </div>

    <div class="section">
      <h2 data-i18n="setup">Your personalized setup</h2>
      <div class="items" id="items"></div>
    </div>

    <div class="section">
      <h2 data-i18n="profile">Profile</h2>
      <div class="prof">
        <div class="fld">
          <label for="pName" data-i18n="display_name">Display name</label>
          <input id="pName" type="text" maxlength="60" data-i18n-ph="your_name" placeholder="Your name">
          <div style="margin-top:12px">
            <label data-i18n="avatar">Avatar</label>
            <div class="avs" id="avs"></div>
          </div>
        </div>
        <button class="save" id="saveProfile" data-i18n="save">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const BGS={
    warm:"linear-gradient(180deg,#887326EB,#382C1F,#1F2838),#16303a",
    midnight:"linear-gradient(180deg,#1f2838,#0d1420)",
    forest:"linear-gradient(180deg,#1c3a2e,#0b1a14)",
    ocean:"linear-gradient(180deg,#123246,#06131f)",
    plum:"linear-gradient(180deg,#2a1f38,#140d1c)",
    slate:"linear-gradient(180deg,#2a2f38,#111418)",
    ember:"linear-gradient(180deg,#3a2418,#160b08)",
    rose:"linear-gradient(180deg,#3a2028,#160a10)",
    sand:"linear-gradient(180deg,#4a3a28,#1d1610)",
    mint:"linear-gradient(180deg,#1e3a38,#0a1a19)",
    indigo:"linear-gradient(180deg,#232a4a,#0d1024)",
    crimson:"linear-gradient(180deg,#3d1c22,#170a0c)",
    moss:"linear-gradient(180deg,#2f3a24,#131a0e)",
    charcoal:"linear-gradient(180deg,#2c2c2e,#0b0b0c)"
  };
  const I=window.FocusI18n, t=k=>I.t(k), N=v=>I.num(v);
  // Units live in i18n.js: "1h 20m" in English, "۱ ساعت ۲۰ دقیقه" in Persian.
  const durS=s=>I.durSecs(s), durM=m=>I.durMins(m);
  const PROG={bar:"prog_bar",rabbit:"prog_rabbit",rocket:"prog_rocket",runner:"prog_runner"};
  const AVATARS=["🦊","🐱","🐼","🦉","🐧","🐢","🐝","🌸","🚀","⭐","🔥","🌙"];
  let selAvatar="🦊";

  $("#langLabel").textContent=t("lang_switch");
  $("#langBtn").onclick=()=>I.toggle();

  function weekday(iso){ return new Date(iso+"T00:00").toLocaleDateString(I.locale(),{weekday:"short"}).slice(0,2); }

  fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json()).then(render).catch(()=>{
    // drop the key first so a later i18n pass can't paint "Loading…" back over the error
    $("#loading").removeAttribute("data-i18n");
    $("#loading").textContent=t("no_server_running");
  });

  function render(j){
    if(!j || !j.user){ location.href="/login"; return; }
    const u=j.user, s=j.settings||{}, st=j.stats||{};
    $("#loading").style.display="none"; $("#content").style.display="block";

    // header + profile
    $("#hAvatar").textContent=u.avatar||"🦊";
    $("#hName").textContent=u.name||u.email.split("@")[0];
    $("#hEmail").textContent=u.email;
    $("#pName").value=u.name||"";
    selAvatar=u.avatar||"🦊";
    const avs=$("#avs"); avs.innerHTML="";
    (AVATARS.includes(selAvatar)?AVATARS:[selAvatar,...AVATARS]).forEach(a=>{
      const b=document.createElement("button"); b.className="av"+(a===selAvatar?" sel":""); b.textContent=a; b.type="button";
      b.onclick=()=>{selAvatar=a;avs.querySelectorAll(".av").forEach(x=>x.classList.toggle("sel",x.textContent===a));};
      avs.appendChild(b);
    });

    // chart
    const hist=st.history||[];
    const max=Math.max(1,...hist.map(d=>d.minutes));
    const todayISO=new Date().toISOString().slice(0,10);
    if(hist.some(d=>d.minutes>0)){
      $("#chart").className="chart";
      $("#chart").innerHTML=hist.map(d=>{
        const h=Math.round(d.minutes/max*100);
        return '<div class="bar'+(d.day===todayISO?" today":"")+'"><span class="mv">'+N(d.minutes)+'</span>'+
               '<div class="fill" style="height:'+h+'%"></div><span class="d">'+weekday(d.day)+'</span></div>';
      }).join("");
    } else {
      $("#chart").className="chart-empty";
      $("#chart").textContent=t("chart_empty");
    }

    // personalized items
    const cfg=s.cfg||{}, prefs=s.prefs||{};
    const bgId = s.bg && s.bg.type==="image" ? "image" : (s.bg&&s.bg.value)||"warm";
    const bgSwatch = bgId==="image" ? '<span class="swatch" style="background:#333"></span>'+t("custom_image")
      : '<span class="swatch" style="background:'+(BGS[bgId]||BGS.warm)+'"></span>'+t("bg_"+bgId);
    // durations can arrive null from an older corrupted config, so fall back per-field
    const dur=(v,d)=>N(Number.isFinite(Number(v))&&Number(v)>0?Number(v):d);
    const items=[
      {l:t("background"), v:bgSwatch},
      {l:t("language"), v:(prefs.lang==="fa"?"فارسی":"English")},
      {l:t("focus_length"), v:dur(cfg.focusMin,25)+" "+t("min")},
      {l:t("breaks"), v:dur(cfg.shortMin,5)+" / "+dur(cfg.longMin,15)+" "+t("min")},
      {l:t("progress_style"), v:t(PROG[prefs.progress||"rabbit"]||PROG.rabbit)},
      {l:t("end_chime"), v:t(prefs.chime===false?"off":"on")}
    ];
    $("#items").innerHTML=items.map(i=>'<div class="item"><div class="il">'+i.l+'</div><div class="iv">'+i.v+'</div></div>').join("");
    loadCalendar(ymNow());
    renderSubjects(j.subjects||[]);
  }

  $("#saveProfile").onclick=async ()=>{
    const btn=$("#saveProfile");
    try{
      const r=await fetch("/api/profile",{method:"PATCH",credentials:"same-origin",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:$("#pName").value.trim(),avatar:selAvatar})});
      const j=await r.json();
      if(j&&j.user){ $("#hAvatar").textContent=j.user.avatar; $("#hName").textContent=j.user.name||j.user.email.split("@")[0];
        btn.textContent=t("saved"); btn.classList.add("saved"); setTimeout(()=>{btn.textContent=t("save");btn.classList.remove("saved");},1600);
      }
    }catch(e){ btn.textContent=t("error"); setTimeout(()=>btn.textContent=t("save"),1600); }
  };

  $("#logout").onclick=async ()=>{
    try{ await fetch("/api/logout",{method:"POST",credentials:"same-origin"}); }catch(e){}
    location.href="/login";
  };

  /* ---------- study calendar ---------- */
  var calMonth=null, calData={}, calSel=null;
  function ymNow(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function shiftMonth(ym,delta){ var p=(ym||ymNow()).split('-'); var d=new Date(+p[0],+p[1]-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function loadCalendar(month){ calMonth=month;
    fetch('/api/calendar?month='+month,{credentials:'same-origin'}).then(function(r){return r.ok?r.json():{days:[]};}).then(function(j){
      calData={}; (j.days||[]).forEach(function(d){calData[d.day]=d;}); renderCalendar();
    }).catch(function(){});
  }
  function renderCalendar(){
    var p=calMonth.split('-'), y=+p[0], m=+p[1];
    $("#calLabel").textContent=new Date(y,m-1,1).toLocaleDateString(I.locale(),{month:'long',year:'numeric'});
    var first=new Date(y,m-1,1).getDay(), dim=new Date(y,m,0).getDate();
    var maxMin=1; Object.keys(calData).forEach(function(k){maxMin=Math.max(maxMin,calData[k].minutes);});
    var todayISO=new Date().toISOString().slice(0,10);
    var g=$("#calGrid"); g.innerHTML='';
    t('dow').forEach(function(d){var e=document.createElement('div');e.className='cal-dow';e.textContent=d;g.appendChild(e);});
    for(var i=0;i<first;i++){var e=document.createElement('div');e.className='cal-cell empty';g.appendChild(e);}
    for(var day=1;day<=dim;day++){
      var iso=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0'), cell=calData[iso];
      var el=document.createElement('div');
      el.className='cal-cell'+(cell?' has':' dim')+(iso===todayISO?' today':'')+(iso===calSel?' sel':'');
      el.dataset.iso=iso;
      if(cell){var pct=Math.round(cell.minutes/maxMin*70)+12; el.style.background='color-mix(in oklch, var(--accent) '+pct+'%, var(--cream2))';}
      el.innerHTML='<span class="dn">'+N(day)+'</span>'+(cell?'<span class="cm">'+I.durCompact(cell.minutes)+'</span>':'');
      if(cell) el.onclick=(function(x){return function(){selectDay(x);};})(iso);
      g.appendChild(el);
    }
    if(calSel && calData[calSel]) selectDay(calSel);
  }
  function selectDay(iso){
    calSel=iso;
    document.querySelectorAll('.cal-cell').forEach(function(c){c.classList.toggle('sel',c.dataset.iso===iso);});
    var d=calData[iso], det=$("#calDetail");
    var lbl=new Date(iso+'T00:00').toLocaleDateString(I.locale(),{weekday:'long',month:'long',day:'numeric'});
    if(!d){det.innerHTML='';det.appendChild(Object.assign(document.createElement('div'),{className:'none',textContent:I.tf('nothing_on',lbl)}));return;}
    det.innerHTML='<h3>'+lbl+' · '+durM(d.minutes)+' · '+N(d.sessions)+' '+t(d.sessions===1?'session_one':'session_many')+'</h3>';
    // One row per subject with its total for the day -- the server groups them, so a subject
    // studied across several blocks appears once rather than once per block.
    if(d.topics&&d.topics.length){
      d.topics.forEach(function(tp){
        var row=document.createElement('div'); row.className='topic';
        var b=document.createElement('span'); b.className='b'; b.textContent='▸';
        var s=document.createElement('span'); s.className='tn'; s.textContent=tp.name||tp;
        var m=document.createElement('span'); m.className='tm mono'; m.textContent=durS(tp.seconds);
        row.appendChild(b); row.appendChild(s); row.appendChild(m); det.appendChild(row);
      });
    }
    else { det.appendChild(Object.assign(document.createElement('div'),{className:'none',textContent:t('no_notes')})); }
  }
  $("#calPrev").onclick=function(){ loadCalendar(shiftMonth(calMonth,-1)); };
  $("#calNext").onclick=function(){ loadCalendar(shiftMonth(calMonth,1)); };

  /* ---------- subjects ---------- */
  var SUBJ_COLORS=["#d9a24e","#5b8def","#3a9d5d","#c05fd6","#e0685a","#4bb3c4"];
  var pickColor=SUBJ_COLORS[0];
  function renderColorPick(){ var w=$("#colorPick"); w.innerHTML=""; SUBJ_COLORS.forEach(function(c){var b=document.createElement("button");b.type="button";b.style.background=c;b.className=(c===pickColor?"on":"");b.onclick=function(){pickColor=c;renderColorPick();};w.appendChild(b);}); }
  function renderSubjects(list){
    var box=$("#subjList"); if(!box) return;
    if(!list||!list.length){ box.innerHTML="";box.appendChild(Object.assign(document.createElement('div'),{className:'subj-empty',textContent:t('subjects_empty')})); return; }
    box.innerHTML="";
    list.forEach(function(s){
      var row=document.createElement("div"); row.className="subj-row";
      row.innerHTML='<span class="cdot"></span><span class="snm"></span><span class="stime mono"></span><button class="del">×</button>';
      row.querySelector(".stime").textContent=durM(s.todayMinutes);
      row.querySelector(".cdot").style.background=s.color;
      row.querySelector(".snm").textContent=s.name;
      row.querySelector(".del").title=t("delete");
      row.querySelector(".del").onclick=function(){ if(confirm(I.tf('confirm_del_subject',s.name))) fetch("/api/subjects/"+s.id,{method:"DELETE",credentials:"same-origin"}).then(function(r){return r.json();}).then(function(j){renderSubjects(j.subjects);}); };
      box.appendChild(row);
    });
  }
  $("#addSubj").onclick=function(){
    var name=$("#subjName").value.trim(); if(!name) return;
    fetch("/api/subjects",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,color:pickColor})}).then(function(r){return r.json();}).then(function(j){ if(j.subjects){renderSubjects(j.subjects);$("#subjName").value="";} });
  };
  $("#subjName").addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();$("#addSubj").click();} });
  renderColorPick();
})();
</script>
</body>
</html>
