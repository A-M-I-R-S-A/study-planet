<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus — Your dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:oklch(0.7 0.12 62);--accent-ink:#16303a;--cream:#faf6ee;--cream2:#efe9de;--ink:#2b2824;--muted:#8a8175;--white:#fbfdfd;--danger:#c0392b}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:#16303a;min-height:100vh;-webkit-font-smoothing:antialiased}
  .mono{font-family:'DM Mono',ui-monospace,monospace}
  .wrap{max-width:920px;margin:0 auto;padding:clamp(18px,4vw,40px)}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
  .who{display:flex;align-items:center;gap:13px}
  .avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:26px;backdrop-filter:blur(8px)}
  .who .nm{font-size:20px;font-weight:600;color:var(--white);letter-spacing:-.01em}
  .who .em{font-size:13px;color:rgba(255,255,255,.66);margin-top:1px}
  .hbtns{display:flex;gap:9px}
  .hbtn{height:42px;padding:0 16px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:var(--white);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;text-decoration:none;backdrop-filter:blur(8px)}
  .hbtn:hover{background:rgba(255,255,255,.24)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--cream);border-radius:20px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.26)}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
  .stat .v{font-size:34px;line-height:1;margin-top:12px;color:var(--ink)}
  .stat .v small{font-size:16px;color:var(--muted)}
  .stat.hl{background:linear-gradient(150deg,var(--accent),color-mix(in oklch,var(--accent) 62%,#e08a3c));color:var(--accent-ink)}
  .stat.hl .k{color:rgba(22,48,58,.7)}
  .stat.hl .v{color:var(--accent-ink)}

  .section{background:var(--cream);border-radius:22px;padding:22px 22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.26);margin-bottom:22px}
  .section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 18px}

  /* chart */
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0}
  .bar .fill{width:100%;max-width:26px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s ease;position:relative}
  .bar.today .fill{box-shadow:0 0 0 2px var(--ink)}
  .bar .d{font-size:10px;color:var(--muted);white-space:nowrap}
  .bar .mv{font-size:10px;color:var(--muted);opacity:0;transition:.15s}
  .bar:hover .mv{opacity:1}
  .chart-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:40px 0}

  /* personalized items */
  .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .item{background:var(--cream2);border-radius:14px;padding:14px}
  .item .il{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .item .iv{font-size:15px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:8px}
  .swatch{width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.15);flex:none}

  /* profile editor */
  .prof{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .prof .fld{flex:1;min-width:180px}
  .prof label{display:block;font-size:12px;color:var(--muted);margin:0 2px 6px}
  .prof input{width:100%;border:1px solid rgba(0,0,0,.14);background:#fff;border-radius:11px;padding:11px 12px;font-size:14px;color:var(--ink);outline:none}
  .prof input:focus{border-color:var(--accent)}
  .avs{display:flex;flex-wrap:wrap;gap:6px}
  .av{width:38px;height:38px;border-radius:11px;border:1px solid rgba(0,0,0,.12);background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .av.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .save{height:44px;padding:0 22px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer}
  .save.saved{background:#2e7d46;color:#fff}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head .mlabel{font-size:15px;font-weight:600;color:var(--ink)}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:32px;height:32px;border-radius:9px;border:1px solid rgba(0,0,0,.12);background:var(--cream2);cursor:pointer;font-size:16px;color:var(--ink);line-height:1}
  .cal-nav button:hover{background:#e7dfd1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
  .cal-cell{aspect-ratio:1;border-radius:10px;background:var(--cream2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;border:1.5px solid transparent}
  .cal-cell.empty{background:transparent}
  .cal-cell.has{cursor:pointer}
  .cal-cell.has:hover{filter:brightness(1.04)}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell.sel{box-shadow:0 0 0 2px var(--ink)}
  .cal-cell .dn{font-size:12px;color:var(--ink)}
  .cal-cell.dim .dn{color:#b9b1a4}
  .cal-cell .cm{font-size:9px;color:var(--accent-ink);font-family:'DM Mono',monospace;font-weight:500}
  .cal-day-detail{margin-top:16px;background:var(--cream2);border-radius:14px;padding:16px}
  .cal-day-detail h3{margin:0 0 10px;font-size:14px}
  .cal-day-detail .topic{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-top:1px solid rgba(0,0,0,.06)}
  .cal-day-detail .topic:first-of-type{border-top:none}
  .cal-day-detail .topic .b{color:var(--accent)}
  .cal-day-detail .none{color:var(--muted);font-size:13px}
  .loading{color:rgba(255,255,255,.8);text-align:center;padding:80px 0;font-size:15px}
</style>
</head>
<body>
<script src="/theme.js"></script>
<div class="wrap" id="wrap">
  <div class="loading" id="loading">Loading your dashboard…</div>
  <div id="content" style="display:none">
    <header>
      <div class="who">
        <div class="avatar" id="hAvatar">🦊</div>
        <div>
          <div class="nm" id="hName">—</div>
          <div class="em" id="hEmail">—</div>
        </div>
      </div>
      <div class="hbtns">
        <a class="hbtn" href="/">⏱ Timer</a>
        <a class="hbtn" href="/rooms">👥 Rooms</a>
        <button class="hbtn" id="logout">Sign out</button>
      </div>
    </header>

    <div class="grid" id="statGrid"></div>

    <div class="section">
      <h2>Last 14 days · focus minutes</h2>
      <div id="chart"></div>
    </div>

    <div class="section">
      <h2>Study calendar</h2>
      <div class="cal-head">
        <div class="mlabel" id="calLabel">—</div>
        <div class="cal-nav"><button id="calPrev" aria-label="Previous month">‹</button><button id="calNext" aria-label="Next month">›</button></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-day-detail" id="calDetail"><div class="none">Pick a day to see what you studied.</div></div>
    </div>

    <div class="section">
      <h2>Your personalized setup</h2>
      <div class="items" id="items"></div>
    </div>

    <div class="section">
      <h2>Profile</h2>
      <div class="prof">
        <div class="fld">
          <label for="pName">Display name</label>
          <input id="pName" type="text" maxlength="60" placeholder="Your name">
          <div style="margin-top:12px">
            <label>Avatar</label>
            <div class="avs" id="avs"></div>
          </div>
        </div>
        <button class="save" id="saveProfile">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const BGS={
    warm:"linear-gradient(180deg,#887326EB,#382C1F,#1F2838),#16303a",
    midnight:"linear-gradient(180deg,#1f2838,#0d1420)",
    forest:"linear-gradient(180deg,#1c3a2e,#0b1a14)",
    ocean:"linear-gradient(180deg,#123246,#06131f)",
    plum:"linear-gradient(180deg,#2a1f38,#140d1c)",
    slate:"linear-gradient(180deg,#2a2f38,#111418)",
    ember:"linear-gradient(180deg,#3a2418,#160b08)",
    rose:"linear-gradient(180deg,#3a2028,#160a10)"
  };
  const PROG={bar:"▬ Bar",rabbit:"🐇 Rabbit → 🥕",rocket:"🚀 Rocket → 🌙",runner:"🏃 Runner → 🏁"};
  const AVATARS=["🦊","🐱","🐼","🦉","🐧","🐢","🐝","🌸","🚀","⭐","🔥","🌙"];
  let selAvatar="🦊";

  function fmtDur(mins){ const h=Math.floor(mins/60), m=mins%60; return h? (h+"h "+(m?m+"m":"")) : (m+"m"); }
  function weekday(iso){ return new Date(iso+"T00:00").toLocaleDateString(undefined,{weekday:"short"}).slice(0,2); }

  fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json()).then(render).catch(()=>{
    $("#loading").textContent="Couldn't reach the server. Is it running?";
  });

  function render(j){
    if(!j || !j.user){ location.href="/login"; return; }
    const u=j.user, s=j.settings||{}, st=j.stats||{};
    $("#loading").style.display="none"; $("#content").style.display="block";

    // header + profile
    $("#hAvatar").textContent=u.avatar||"🦊";
    $("#hName").textContent=u.name||u.email.split("@")[0];
    $("#hEmail").textContent=u.email;
    $("#pName").value=u.name||"";
    selAvatar=u.avatar||"🦊";
    const avs=$("#avs"); avs.innerHTML="";
    (AVATARS.includes(selAvatar)?AVATARS:[selAvatar,...AVATARS]).forEach(a=>{
      const b=document.createElement("button"); b.className="av"+(a===selAvatar?" sel":""); b.textContent=a; b.type="button";
      b.onclick=()=>{selAvatar=a;avs.querySelectorAll(".av").forEach(x=>x.classList.toggle("sel",x.textContent===a));};
      avs.appendChild(b);
    });

    // stat cards
    const cards=[
      {k:"🔥 Streak", v:(st.streak||0), s:" day"+((st.streak||0)===1?"":"s"), hl:true},
      {k:"Total focus", v:Math.floor((st.totalMinutes||0)/60), s:"h "+((st.totalMinutes||0)%60)+"m"},
      {k:"Sessions", v:(st.totalSessions||0)},
      {k:"Today", v:((st.today&&st.today.minutes)||0), s:"m · "+((st.today&&st.today.sessions)||0)+" sess"},
      {k:"Best day", v:(st.bestMinutes||0), s:"m"},
      {k:"Active days", v:(st.activeDays||0)}
    ];
    $("#statGrid").innerHTML=cards.map(c=>
      '<div class="card stat'+(c.hl?" hl":"")+'"><div class="k">'+c.k+'</div><div class="v mono">'+c.v+(c.s?'<small>'+c.s+'</small>':'')+'</div></div>'
    ).join("");

    // chart
    const hist=st.history||[];
    const max=Math.max(1,...hist.map(d=>d.minutes));
    const todayISO=new Date().toISOString().slice(0,10);
    if(hist.some(d=>d.minutes>0)){
      $("#chart").className="chart";
      $("#chart").innerHTML=hist.map(d=>{
        const h=Math.round(d.minutes/max*100);
        return '<div class="bar'+(d.day===todayISO?" today":"")+'"><span class="mv">'+d.minutes+'</span>'+
               '<div class="fill" style="height:'+h+'%"></div><span class="d">'+weekday(d.day)+'</span></div>';
      }).join("");
    } else {
      $("#chart").className="chart-empty";
      $("#chart").textContent="No focus sessions yet — start a timer and your history will grow here.";
    }

    // personalized items
    const cfg=s.cfg||{}, prefs=s.prefs||{};
    const bgId = s.bg && s.bg.type==="image" ? "image" : (s.bg&&s.bg.value)||"warm";
    const bgSwatch = bgId==="image" ? '<span class="swatch" style="background:#333"></span>Custom image'
      : '<span class="swatch" style="background:'+(BGS[bgId]||BGS.warm)+'"></span>'+bgId.charAt(0).toUpperCase()+bgId.slice(1);
    const items=[
      {l:"Background", v:bgSwatch},
      {l:"Language", v:(prefs.lang==="fa"?"فارسی":"English")},
      {l:"Focus length", v:(cfg.focusMin||25)+" min"},
      {l:"Breaks", v:(cfg.shortMin||5)+" / "+(cfg.longMin||15)+" min"},
      {l:"Progress style", v:PROG[prefs.progress||"rabbit"]||PROG.rabbit},
      {l:"End chime", v:(prefs.chime===false?"Off":"On")}
    ];
    $("#items").innerHTML=items.map(i=>'<div class="item"><div class="il">'+i.l+'</div><div class="iv">'+i.v+'</div></div>').join("");
    loadCalendar(ymNow());
  }

  $("#saveProfile").onclick=async ()=>{
    const btn=$("#saveProfile");
    try{
      const r=await fetch("/api/profile",{method:"PATCH",credentials:"same-origin",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:$("#pName").value.trim(),avatar:selAvatar})});
      const j=await r.json();
      if(j&&j.user){ $("#hAvatar").textContent=j.user.avatar; $("#hName").textContent=j.user.name||j.user.email.split("@")[0];
        btn.textContent="Saved ✓"; btn.classList.add("saved"); setTimeout(()=>{btn.textContent="Save";btn.classList.remove("saved");},1600);
      }
    }catch(e){ btn.textContent="Error"; setTimeout(()=>btn.textContent="Save",1600); }
  };

  $("#logout").onclick=async ()=>{
    try{ await fetch("/api/logout",{method:"POST",credentials:"same-origin"}); }catch(e){}
    location.href="/login";
  };

  /* ---------- study calendar ---------- */
  var calMonth=null, calData={}, calSel=null;
  function ymNow(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function shiftMonth(ym,delta){ var p=(ym||ymNow()).split('-'); var d=new Date(+p[0],+p[1]-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function loadCalendar(month){ calMonth=month;
    fetch('/api/calendar?month='+month,{credentials:'same-origin'}).then(function(r){return r.ok?r.json():{days:[]};}).then(function(j){
      calData={}; (j.days||[]).forEach(function(d){calData[d.day]=d;}); renderCalendar();
    }).catch(function(){});
  }
  function renderCalendar(){
    var p=calMonth.split('-'), y=+p[0], m=+p[1];
    $("#calLabel").textContent=new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    var first=new Date(y,m-1,1).getDay(), dim=new Date(y,m,0).getDate();
    var maxMin=1; Object.keys(calData).forEach(function(k){maxMin=Math.max(maxMin,calData[k].minutes);});
    var todayISO=new Date().toISOString().slice(0,10);
    var g=$("#calGrid"); g.innerHTML='';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){var e=document.createElement('div');e.className='cal-dow';e.textContent=d;g.appendChild(e);});
    for(var i=0;i<first;i++){var e=document.createElement('div');e.className='cal-cell empty';g.appendChild(e);}
    for(var day=1;day<=dim;day++){
      var iso=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0'), cell=calData[iso];
      var el=document.createElement('div');
      el.className='cal-cell'+(cell?' has':' dim')+(iso===todayISO?' today':'')+(iso===calSel?' sel':'');
      el.dataset.iso=iso;
      if(cell){var pct=Math.round(cell.minutes/maxMin*70)+12; el.style.background='color-mix(in oklch, var(--accent) '+pct+'%, var(--cream2))';}
      el.innerHTML='<span class="dn">'+day+'</span>'+(cell?'<span class="cm">'+cell.minutes+'m</span>':'');
      if(cell) el.onclick=(function(x){return function(){selectDay(x);};})(iso);
      g.appendChild(el);
    }
    if(calSel && calData[calSel]) selectDay(calSel);
  }
  function selectDay(iso){
    calSel=iso;
    document.querySelectorAll('.cal-cell').forEach(function(c){c.classList.toggle('sel',c.dataset.iso===iso);});
    var d=calData[iso], det=$("#calDetail");
    var lbl=new Date(iso+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    if(!d){det.innerHTML='<div class="none">Nothing on '+lbl+'.</div>';return;}
    det.innerHTML='<h3>'+lbl+' · '+d.minutes+'m · '+d.sessions+' session'+(d.sessions===1?'':'s')+'</h3>';
    if(d.topics&&d.topics.length){ d.topics.forEach(function(t){var row=document.createElement('div');row.className='topic';var b=document.createElement('span');b.className='b';b.textContent='▸';var s=document.createElement('span');s.textContent=t;row.appendChild(b);row.appendChild(s);det.appendChild(row);}); }
    else { det.insertAdjacentHTML('beforeend','<div class="none">No study notes recorded this day.</div>'); }
  }
  $("#calPrev").onclick=function(){ loadCalendar(shiftMonth(calMonth,-1)); };
  $("#calNext").onclick=function(){ loadCalendar(shiftMonth(calMonth,1)); };
})();
</script>
</body>
</html>
